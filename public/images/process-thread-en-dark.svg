<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">Process vs Thread — Memory Layout</text>

  <!-- Process 1 -->
  <text x="140" y="34" font-size="9.5" font-weight="700" fill="#60a5fa" text-anchor="middle">Process (isolated memory)</text>
  <rect x="20" y="38" width="240" height="110" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>

  <!-- Process memory sections -->
  <rect x="30" y="48" width="220" height="20" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <text x="140" y="62" font-size="8.5" font-weight="700" fill="#fafafa" text-anchor="middle">Code Segment (instructions)</text>

  <rect x="30" y="72" width="220" height="20" rx="3" fill="#33280f" stroke="#f59e0b" stroke-width="1"/>
  <text x="140" y="86" font-size="8.5" font-weight="700" fill="#fafafa" text-anchor="middle">Data Segment (global variables)</text>

  <rect x="30" y="96" width="105" height="24" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="82" y="106" font-size="8" fill="#6ee7b7" text-anchor="middle">Thread 1</text>
  <text x="82" y="116" font-size="8" fill="#6ee7b7" text-anchor="middle">Stack</text>

  <rect x="145" y="96" width="105" height="24" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="197" y="106" font-size="8" fill="#6ee7b7" text-anchor="middle">Thread 2</text>
  <text x="197" y="116" font-size="8" fill="#6ee7b7" text-anchor="middle">Stack</text>

  <rect x="30" y="124" width="220" height="20" rx="3" fill="#3a1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="140" y="138" font-size="8.5" font-weight="700" fill="#fca5a5" text-anchor="middle">Heap (shared by threads)</text>

  <!-- Process 2 -->
  <text x="460" y="34" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="middle">Another Process (separate)</text>
  <rect x="340" y="38" width="240" height="60" rx="6" fill="#33280f" stroke="#f59e0b" stroke-width="2"/>

  <rect x="350" y="48" width="220" height="16" rx="2" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <text x="460" y="59" font-size="8" fill="#fafafa" text-anchor="middle">Different Code &amp; Data</text>

  <rect x="350" y="68" width="105" height="20" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <text x="402" y="81" font-size="8" fill="#d4d4d8" text-anchor="middle">Thread Stack</text>

  <rect x="465" y="68" width="105" height="20" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <text x="517" y="81" font-size="8" fill="#d4d4d8" text-anchor="middle">Heap Memory</text>

  <!-- Comparison table -->
  <rect x="20" y="158" width="560" height="26" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="50" y="172" font-size="8.5" font-weight="700" fill="#d4d4d8">Key:</text>
  <text x="90" y="172" font-size="8.5" fill="#60a5fa">Process = heavyweight, isolated</text>
  <text x="280" y="172" font-size="8.5" fill="#34d399">Thread = lightweight, shared memory</text>
  <text x="480" y="172" font-size="8.5" fill="#a1a1aa">IPC needed for communication</text>
</svg>
