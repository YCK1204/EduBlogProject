<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#fafafa" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">Virtual Memory — Page Table Translation</text>

  <!-- Virtual Address Space -->
  <text x="100" y="34" font-size="9" font-weight="700" fill="#3b82f6" text-anchor="middle">Virtual Address Space</text>
  <text x="100" y="46" font-size="8" fill="#3b82f6" text-anchor="middle">(each process)</text>

  <!-- Virtual pages -->
  <rect x="30" y="54" width="140" height="18" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="66" font-size="8" text-anchor="middle">Page 0 (Code)</text>

  <rect x="30" y="76" width="140" height="18" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="88" font-size="8" text-anchor="middle">Page 1 (Data)</text>

  <rect x="30" y="98" width="140" height="18" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="110" font-size="8" text-anchor="middle">Page 2 (not mapped)</text>

  <rect x="30" y="120" width="140" height="18" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="132" font-size="8" text-anchor="middle">Page 3 (Stack)</text>

  <rect x="30" y="142" width="140" height="18" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="154" font-size="8" text-anchor="middle">Page 4 (on disk)</text>

  <!-- Page Table -->
  <text x="300" y="34" font-size="9" font-weight="700" fill="#52525b" text-anchor="middle">Page Table (MMU)</text>

  <rect x="220" y="54" width="160" height="106" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  
  <!-- Page table entries -->
  <text x="240" y="70" font-size="8" fill="#52525b">Page 0 → Frame 5</text>
  <text x="240" y="86" font-size="8" fill="#52525b">Page 1 → Frame 2</text>
  <text x="240" y="102" font-size="8" fill="#ef4444">Page 2 → invalid</text>
  <text x="240" y="118" font-size="8" fill="#52525b">Page 3 → Frame 7</text>
  <text x="240" y="134" font-size="8" fill="#f59e0b">Page 4 → on swap</text>
  <text x="240" y="150" font-size="8" fill="#a1a1aa">...</text>

  <!-- Physical Memory -->
  <text x="500" y="34" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">Physical Memory</text>
  <text x="500" y="46" font-size="8" fill="#10b981" text-anchor="middle">(RAM frames)</text>

  <!-- Physical frames -->
  <rect x="430" y="54" width="140" height="18" rx="2" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1"/>
  <text x="500" y="66" font-size="8" text-anchor="middle">Frame 0 (other process)</text>

  <rect x="430" y="76" width="140" height="18" rx="2" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1"/>
  <text x="500" y="88" font-size="8" text-anchor="middle">Frame 1 (free)</text>

  <rect x="430" y="98" width="140" height="18" rx="2" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="110" font-size="8" font-weight="700" text-anchor="middle">Frame 2 → Page 1</text>

  <rect x="430" y="120" width="140" height="18" rx="2" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1"/>
  <text x="500" y="132" font-size="8" text-anchor="middle">Frame 3 (other process)</text>

  <rect x="430" y="142" width="140" height="18" rx="2" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1"/>
  <text x="500" y="154" font-size="8" text-anchor="middle">Frame 4 (free)</text>

  <!-- Translation arrows -->
  <path d="M 170 63 Q 200 60 220 63" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 170 85 Q 200 82 220 85" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 170 129 Q 200 126 220 129" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M 380 85 Q 410 82 430 85" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="300" y="186" font-size="8.5" fill="#a1a1aa" text-anchor="middle">OS manages page faults — loads pages from disk to RAM on demand</text>
</svg>
