<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#52525b"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">컴파일러 vs 인터프리터 — 코드 실행 방식</text>

  <!-- Top: Compiler -->
  <text x="150" y="34" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">컴파일러 (사전 컴파일)</text>

  <rect x="20" y="42" width="80" height="26" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="58" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">소스 코드</text>

  <line x1="100" y1="54" x2="134" y2="54" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="134" y="42" width="80" height="26" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="174" y="58" font-size="9" font-weight="700" fill="#fafafa" text-anchor="middle">컴파일러</text>

  <line x1="214" y1="54" x2="248" y2="54" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="248" y="42" width="80" height="26" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="288" y="58" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">기계어</text>

  <!-- Bottom: Interpreter -->
  <text x="150" y="108" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">인터프리터 (즉시 실행)</text>

  <rect x="20" y="116" width="80" height="26" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="132" font-size="9" font-weight="700" fill="#fafafa" text-anchor="middle">소스 코드</text>

  <line x1="100" y1="128" x2="134" y2="128" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="134" y="116" width="80" height="26" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="174" y="132" font-size="9" font-weight="700" fill="#fafafa" text-anchor="middle">인터프리터</text>

  <line x1="214" y1="128" x2="248" y2="128" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="248" y="116" width="80" height="26" rx="4" fill="#3a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="288" y="132" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">실행</text>

  <!-- Comparison table -->
  <rect x="352" y="28" width="230" height="152" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="467" y="46" font-size="9.5" font-weight="700" fill="#fafafa" text-anchor="middle">주요 차이점</text>

  <!-- Headers -->
  <text x="390" y="62" font-size="8.5" font-weight="700" fill="#d4d4d8" text-anchor="middle">항목</text>
  <text x="450" y="62" font-size="8.5" font-weight="700" fill="#60a5fa" text-anchor="middle">컴파일러</text>
  <text x="520" y="62" font-size="8.5" font-weight="700" fill="#fbbf24" text-anchor="middle">인터프리터</text>
  <line x1="357" y1="65" x2="575" y2="65" stroke="#3f3f46" stroke-width="1"/>

  <!-- Rows -->
  <text x="390" y="78" font-size="8" fill="#d4d4d8" text-anchor="middle">속도</text>
  <text x="450" y="78" font-size="8" fill="#34d399" text-anchor="middle">빠름</text>
  <text x="520" y="78" font-size="8" fill="#f87171" text-anchor="middle">느림</text>

  <text x="390" y="94" font-size="8" fill="#d4d4d8" text-anchor="middle">준비</text>
  <text x="450" y="94" font-size="8" fill="#f87171" text-anchor="middle">빌드 필요</text>
  <text x="520" y="94" font-size="8" fill="#34d399" text-anchor="middle">즉시 실행</text>

  <text x="390" y="110" font-size="8" fill="#d4d4d8" text-anchor="middle">디버깅</text>
  <text x="450" y="110" font-size="8" fill="#f87171" text-anchor="middle">복잡함</text>
  <text x="520" y="110" font-size="8" fill="#34d399" text-anchor="middle">쉬움</text>

  <text x="390" y="126" font-size="8" fill="#d4d4d8" text-anchor="middle">메모리</text>
  <text x="450" y="126" font-size="8" fill="#34d399" text-anchor="middle">효율적</text>
  <text x="520" y="126" font-size="8" fill="#f87171" text-anchor="middle">더 많음</text>

  <text x="390" y="142" font-size="8" fill="#d4d4d8" text-anchor="middle">플랫폼</text>
  <text x="450" y="142" font-size="8" fill="#f87171" text-anchor="middle">종속적</text>
  <text x="520" y="142" font-size="8" fill="#34d399" text-anchor="middle">이식성 높음</text>

  <text x="390" y="158" font-size="8" fill="#d4d4d8" text-anchor="middle">예시</text>
  <text x="450" y="158" font-size="7.5" fill="#60a5fa" text-anchor="middle">C, Rust, Go</text>
  <text x="520" y="158" font-size="7.5" fill="#fbbf24" text-anchor="middle">Python, JS</text>

  <text x="300" y="192" font-size="8.5" fill="#a1a1aa" text-anchor="middle">현대 언어들은 혼합 방식을 자주 사용한다 (바이트코드, JIT 컴파일)</text>
</svg>
