<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="170" fill="#fafafa" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#71717a"/></marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#10b981"/></marker>
    <marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#f87171"/></marker>
  </defs>

  <text x="20" y="16" font-size="10" font-weight="700" fill="#52525b">25 と 47 の間に新しいノード (30) を挿入 — O(1)</text>

  <!-- Before row -->
  <text x="20" y="38" font-size="9" fill="#a1a1aa" font-weight="600">挿入前:</text>
  <rect x="60"  y="26" width="48" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="108" y="26" width="28" height="32" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="84"  y="45" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <line x1="136" y1="42" x2="164" y2="42" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="172" y="26" width="48" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="220" y="26" width="28" height="32" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="196" y="45" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">25</text>
  <line x1="248" y1="42" x2="276" y2="42" stroke="#f87171" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#r)"/>

  <rect x="284" y="26" width="48" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="332" y="26" width="28" height="32" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="308" y="45" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">47</text>
  <line x1="360" y1="42" x2="388" y2="42" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="396" y="26" width="48" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="420" y="45" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">63</text>
  <text x="454" y="45" font-size="10" fill="#d4d4d8">∅</text>

  <!-- Arrow down -->
  <text x="300" y="80" font-size="9" fill="#a1a1aa" text-anchor="middle">① new_node.next = node_25.next  ② node_25.next = new_node</text>

  <!-- After row -->
  <text x="20" y="118" font-size="9" fill="#a1a1aa" font-weight="600">挿入後:</text>
  <rect x="40"  y="96" width="44" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="84"  y="96" width="24" height="32" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="62"  y="115" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <line x1="108" y1="112" x2="130" y2="112" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="138" y="96" width="44" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="182" y="96" width="24" height="32" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="160" y="115" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">25</text>
  <line x1="206" y1="112" x2="228" y2="112" stroke="#10b981" stroke-width="2" marker-end="url(#g)"/>

  <!-- New node -->
  <rect x="236" y="96" width="44" height="32" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="280" y="96" width="24" height="32" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="258" y="115" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">30</text>
  <line x1="304" y1="112" x2="326" y2="112" stroke="#10b981" stroke-width="2" marker-end="url(#g)"/>
  <text x="258" y="142" font-size="8.5" fill="#047857" text-anchor="middle">新しいノード</text>

  <rect x="334" y="96" width="44" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="378" y="96" width="24" height="32" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="356" y="115" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">47</text>
  <line x1="402" y1="112" x2="424" y2="112" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="432" y="96" width="44" height="32" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="454" y="115" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">63</text>
  <text x="490" y="115" font-size="10" fill="#d4d4d8">∅</text>

  <text x="300" y="158" font-size="9" fill="#10b981" text-anchor="middle">ポインタの更新は2回だけ — リストの長さに関係なく O(1)</text>
</svg>
