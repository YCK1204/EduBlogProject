<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#fafafa" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">Process vs Thread — Memory Layout</text>

  <!-- Process 1 -->
  <text x="140" y="34" font-size="9.5" font-weight="700" fill="#3b82f6" text-anchor="middle">Process (isolated memory)</text>
  <rect x="20" y="38" width="240" height="110" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>

  <!-- Process memory sections -->
  <rect x="30" y="48" width="220" height="20" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1"/>
  <text x="140" y="62" font-size="8.5" font-weight="700" fill="#18181b" text-anchor="middle">Code Segment (instructions)</text>

  <rect x="30" y="72" width="220" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="140" y="86" font-size="8.5" font-weight="700" fill="#18181b" text-anchor="middle">Data Segment (global variables)</text>

  <rect x="30" y="96" width="105" height="24" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="82" y="106" font-size="8" fill="#065f46" text-anchor="middle">Thread 1</text>
  <text x="82" y="116" font-size="8" fill="#065f46" text-anchor="middle">Stack</text>

  <rect x="145" y="96" width="105" height="24" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="197" y="106" font-size="8" fill="#065f46" text-anchor="middle">Thread 2</text>
  <text x="197" y="116" font-size="8" fill="#065f46" text-anchor="middle">Stack</text>

  <rect x="30" y="124" width="220" height="20" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="140" y="138" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Heap (shared by threads)</text>

  <!-- Process 2 -->
  <text x="460" y="34" font-size="9.5" font-weight="700" fill="#f59e0b" text-anchor="middle">Another Process (separate)</text>
  <rect x="340" y="38" width="240" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>

  <rect x="350" y="48" width="220" height="16" rx="2" fill="#f4f4f5" stroke="#71717a" stroke-width="1"/>
  <text x="460" y="59" font-size="8" fill="#18181b" text-anchor="middle">Different Code &amp; Data</text>

  <rect x="350" y="68" width="105" height="20" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1"/>
  <text x="402" y="81" font-size="8" fill="#52525b" text-anchor="middle">Thread Stack</text>

  <rect x="465" y="68" width="105" height="20" rx="3" fill="#f4f4f5" stroke="#71717a" stroke-width="1"/>
  <text x="517" y="81" font-size="8" fill="#52525b" text-anchor="middle">Heap Memory</text>

  <!-- Comparison table -->
  <rect x="20" y="158" width="560" height="26" rx="4" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="50" y="172" font-size="8.5" font-weight="700" fill="#52525b">Key:</text>
  <text x="90" y="172" font-size="8.5" fill="#3b82f6">Process = heavyweight, isolated</text>
  <text x="280" y="172" font-size="8.5" fill="#10b981">Thread = lightweight, shared memory</text>
  <text x="480" y="172" font-size="8.5" fill="#a1a1aa">IPC needed for communication</text>
</svg>
