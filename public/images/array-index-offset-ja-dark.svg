<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- 배경 -->
  <rect width="800" height="280" fill="#0f172a" rx="12"/>

  <!-- 제목 -->
  <text x="400" y="30" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">0ベースインデックスの原理</text>
  
  <!-- 메모리 셀들 - 0-based 인덱싱 -->
  <g id="memory-cells">
    <!-- 인덱스 0 -->
    <rect x="80" y="55" width="100" height="65" rx="8" fill="#1e1809" stroke="#f59e0b" stroke-width="3"/>
    <text x="130" y="78" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">42</text>
    <text x="130" y="95" font-size="12" fill="#fbbf24" text-anchor="middle">arr[0]</text>
    <text x="130" y="140" font-size="11" fill="#94a3b8" text-anchor="middle">オフセット: 0</text>
    
    <!-- 인덱스 1 -->
    <rect x="190" y="55" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="240" y="78" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">78</text>
    <text x="240" y="95" font-size="12" fill="#94a3b8" text-anchor="middle">arr[1]</text>
    <text x="240" y="140" font-size="11" fill="#94a3b8" text-anchor="middle">オフセット: 4</text>
    
    <!-- 인덱스 2 -->
    <rect x="300" y="55" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="350" y="78" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">13</text>
    <text x="350" y="95" font-size="12" fill="#94a3b8" text-anchor="middle">arr[2]</text>
    <text x="350" y="140" font-size="11" fill="#94a3b8" text-anchor="middle">オフセット: 8</text>
    
    <!-- 인덱스 3 -->
    <rect x="410" y="55" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="460" y="78" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">91</text>
    <text x="460" y="95" font-size="12" fill="#94a3b8" text-anchor="middle">arr[3]</text>
    <text x="460" y="140" font-size="11" fill="#94a3b8" text-anchor="middle">オフセット: 12</text>
    
    <!-- 인덱스 4 -->
    <rect x="520" y="55" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="570" y="78" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">5</text>
    <text x="570" y="95" font-size="12" fill="#94a3b8" text-anchor="middle">arr[4]</text>
    <text x="570" y="140" font-size="11" fill="#94a3b8" text-anchor="middle">オフセット: 16</text>
  </g>
  
  <!-- 구분선 -->
  <line x1="60" y1="155" x2="740" y2="155" stroke="#475569" stroke-width="2"/>
  
  <!-- 0-기반 설명 -->
  <rect x="80" y="185" width="300" height="70" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="210" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">0ベースインデックス（現在）</text>
  <text x="230" y="227" font-size="12" fill="#4ade80" text-anchor="middle">アドレス = ベース + i × サイズ</text>
  <text x="230" y="240" font-size="11" fill="#4ade80" text-anchor="middle">最初の要素: ベース + 0 = ベース ✓</text>
  
  <!-- 1-기반 설명 -->
  <rect x="400" y="185" width="320" height="70" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="210" font-size="14" font-weight="700" fill="#f87171" text-anchor="middle">1ベースインデックス（仮定）</text>
  <text x="560" y="227" font-size="12" fill="#f87171" text-anchor="middle">アドレス = ベース + (i-1) × サイズ</text>
  <text x="560" y="240" font-size="11" fill="#f87171" text-anchor="middle">最初の要素: ベース + (1-1) = ベース（複雑）</text>
</svg>