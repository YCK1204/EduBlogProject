<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#fafafa" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">일급 함수 — map, filter, reduce</text>

  <!-- Input array -->
  <text x="80" y="34" font-size="9" fill="#a1a1aa" text-anchor="middle">입력 배열:</text>
  <rect x="20" y="42" width="120" height="28" rx="4" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="80" y="60" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">[1, 2, 3, 4, 5]</text>

  <!-- Map -->
  <text x="80" y="88" font-size="9" font-weight="700" fill="#3b82f6" text-anchor="middle">map (각 원소 변환)</text>
  <rect x="20" y="96" width="120" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="110" font-size="8" font-family="monospace" text-anchor="middle">x => x * 2</text>
  <text x="80" y="124" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">[2, 4, 6, 8, 10]</text>

  <!-- Filter -->
  <text x="240" y="88" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">filter (원소 선택)</text>
  <rect x="180" y="96" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="240" y="110" font-size="8" font-family="monospace" text-anchor="middle">x => x > 2</text>
  <text x="240" y="124" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">[3, 4, 5]</text>

  <!-- Reduce -->
  <text x="400" y="88" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">reduce (누적)</text>
  <rect x="340" y="96" width="120" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="110" font-size="8" font-family="monospace" text-anchor="middle">(sum, x) => sum + x</text>
  <text x="400" y="124" font-size="9" font-weight="700" fill="#18181b" text-anchor="middle">15</text>

  <!-- Chaining example -->
  <text x="300" y="158" font-size="9" font-weight="700" fill="#52525b" text-anchor="middle">체이닝 (함수 합성)</text>
  <rect x="40" y="166" width="520" height="24" rx="4" fill="#18181b"/>
  <text x="300" y="182" font-size="8.5" fill="#22d3ee" font-family="monospace" text-anchor="middle">[1,2,3,4,5].filter(x => x > 2).map(x => x * 2).reduce((sum, x) => sum + x)</text>

  <text x="300" y="196" font-size="8.5" fill="#a1a1aa" text-anchor="middle">결과: [3,4,5] → [6,8,10] → 24</text>
</svg>
