<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="170" fill="#18181b" rx="10"/>

  <text x="300" y="18" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">인덱스 = 기준 주소로부터의 오프셋</text>

  <rect x="30" y="26" width="84" height="50" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="72" y="50" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">42</text>
  <text x="72" y="64" font-size="8.5" fill="#fcd34d" text-anchor="middle">arr[0]</text>

  <rect x="120" y="26" width="84" height="50" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="162" y="50" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">78</text>
  <text x="162" y="64" font-size="8.5" fill="#a1a1aa" text-anchor="middle">arr[1]</text>

  <rect x="210" y="26" width="84" height="50" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="252" y="50" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">13</text>
  <text x="252" y="64" font-size="8.5" fill="#a1a1aa" text-anchor="middle">arr[2]</text>

  <rect x="300" y="26" width="84" height="50" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="342" y="50" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">91</text>
  <text x="342" y="64" font-size="8.5" fill="#a1a1aa" text-anchor="middle">arr[3]</text>

  <rect x="390" y="26" width="84" height="50" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="432" y="50" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">5</text>
  <text x="432" y="64" font-size="8.5" fill="#a1a1aa" text-anchor="middle">arr[4]</text>

  <text x="72"  y="88" font-size="8.5" fill="#a1a1aa" text-anchor="middle">+0 B</text>
  <text x="162" y="88" font-size="8.5" fill="#a1a1aa" text-anchor="middle">+4 B</text>
  <text x="252" y="88" font-size="8.5" fill="#a1a1aa" text-anchor="middle">+8 B</text>
  <text x="342" y="88" font-size="8.5" fill="#a1a1aa" text-anchor="middle">+12 B</text>
  <text x="432" y="88" font-size="8.5" fill="#a1a1aa" text-anchor="middle">+16 B</text>

  <line x1="20" y1="100" x2="580" y2="100" stroke="#3f3f46" stroke-width="1"/>

  <rect x="30" y="110" width="240" height="42" rx="6" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="150" y="126" font-size="9.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">0 기반 (현재)</text>
  <text x="150" y="142" font-size="10" fill="#34d399" text-anchor="middle" font-weight="600">addr = Base + i × size  ✓</text>

  <rect x="290" y="110" width="280" height="42" rx="6" fill="#231416" stroke="#f87171" stroke-width="1"/>
  <text x="430" y="126" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">1 기반 (가정)</text>
  <text x="430" y="142" font-size="10" fill="#fca5a5" text-anchor="middle" font-weight="600">addr = Base + (i−1) × size  ✗</text>
</svg>
