<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>

  <rect x="20" y="16" width="560" height="28" rx="5" fill="#27272a"/>
  <text x="130" y="34" font-size="10" font-weight="700" fill="white" text-anchor="middle">操作</text>
  <text x="290" y="34" font-size="10" font-weight="700" fill="white" text-anchor="middle">静的配列</text>
  <text x="420" y="34" font-size="10" font-weight="700" fill="white" text-anchor="middle">動的配列</text>
  <text x="540" y="34" font-size="10" font-weight="700" fill="white" text-anchor="middle">備考</text>
  <line x1="220" y1="16" x2="220" y2="44" stroke="#52525b" stroke-width="1"/>
  <line x1="360" y1="16" x2="360" y2="44" stroke="#52525b" stroke-width="1"/>
  <line x1="480" y1="16" x2="480" y2="44" stroke="#52525b" stroke-width="1"/>

  <rect x="20" y="44" width="560" height="30" fill="#14211b"/>
  <text x="130" y="63" font-size="9.5" fill="#fafafa" text-anchor="middle" font-weight="600">アクセス arr[i]</text>
  <rect x="258" y="50" width="64" height="18" rx="3" fill="#10b981"/>
  <text x="290" y="62" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(1)</text>
  <rect x="388" y="50" width="64" height="18" rx="3" fill="#10b981"/>
  <text x="420" y="62" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(1)</text>
  <text x="540" y="63" font-size="8.5" fill="#166534" text-anchor="middle">常に定数時間 ★</text>

  <rect x="20" y="74" width="560" height="30" fill="#18181b"/>
  <text x="130" y="93" font-size="9.5" fill="#fafafa" text-anchor="middle" font-weight="600">探索（線形）</text>
  <rect x="258" y="80" width="64" height="18" rx="3" fill="#f59e0b"/>
  <text x="290" y="92" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(n)</text>
  <rect x="388" y="80" width="64" height="18" rx="3" fill="#f59e0b"/>
  <text x="420" y="92" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(n)</text>
  <text x="540" y="93" font-size="8.5" fill="#fcd34d" text-anchor="middle">最悪の場合: 末尾まで走査</text>

  <rect x="20" y="104" width="560" height="30" fill="#14211b"/>
  <text x="130" y="123" font-size="9.5" fill="#fafafa" text-anchor="middle" font-weight="600">追加（末尾）</text>
  <text x="290" y="123" font-size="9" fill="#a1a1aa" text-anchor="middle">なし（固定長）</text>
  <rect x="388" y="110" width="64" height="18" rx="3" fill="#10b981"/>
  <text x="420" y="122" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(1)*</text>
  <text x="540" y="123" font-size="8.5" fill="#166534" text-anchor="middle">*償却</text>

  <rect x="20" y="134" width="560" height="30" fill="#18181b"/>
  <text x="130" y="153" font-size="9.5" fill="#fafafa" text-anchor="middle" font-weight="600">挿入（中間）</text>
  <rect x="258" y="140" width="64" height="18" rx="3" fill="#ef4444"/>
  <text x="290" y="152" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(n)</text>
  <rect x="388" y="140" width="64" height="18" rx="3" fill="#ef4444"/>
  <text x="420" y="152" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(n)</text>
  <text x="540" y="153" font-size="8.5" fill="#991b1b" text-anchor="middle">要素のシフトが必要</text>

  <rect x="20" y="164" width="560" height="30" fill="#14211b"/>
  <text x="130" y="183" font-size="9.5" fill="#fafafa" text-anchor="middle" font-weight="600">削除（中間）</text>
  <rect x="258" y="170" width="64" height="18" rx="3" fill="#ef4444"/>
  <text x="290" y="182" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(n)</text>
  <rect x="388" y="170" width="64" height="18" rx="3" fill="#ef4444"/>
  <text x="420" y="182" font-size="10" font-weight="800" fill="white" text-anchor="middle">O(n)</text>
  <text x="540" y="183" font-size="8.5" fill="#991b1b" text-anchor="middle">空いた隙間を埋める必要</text>

  <rect x="20" y="44" width="560" height="150" fill="none" stroke="#3f3f46" stroke-width="1" rx="0"/>
  <line x1="20" y1="74"  x2="580" y2="74"  stroke="#3f3f46" stroke-width="1"/>
  <line x1="20" y1="104" x2="580" y2="104" stroke="#3f3f46" stroke-width="1"/>
  <line x1="20" y1="134" x2="580" y2="134" stroke="#3f3f46" stroke-width="1"/>
  <line x1="20" y1="164" x2="580" y2="164" stroke="#3f3f46" stroke-width="1"/>
  <line x1="220" y1="44" x2="220" y2="194" stroke="#3f3f46" stroke-width="1"/>
  <line x1="360" y1="44" x2="360" y2="194" stroke="#3f3f46" stroke-width="1"/>
  <line x1="480" y1="44" x2="480" y2="194" stroke="#3f3f46" stroke-width="1"/>
</svg>
