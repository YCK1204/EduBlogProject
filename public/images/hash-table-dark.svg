<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#52525b"/></marker>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#10b981"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">해시 테이블 — 키 → hash(key) % n → 인덱스 → 값</text>

  <!-- Keys (left) -->
  <text x="52" y="44" font-size="9" fill="#a1a1aa" text-anchor="middle">키</text>
  <rect x="18" y="52" width="68" height="24" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="68" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">"apple"</text>
  <rect x="18" y="82" width="68" height="24" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="98" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">"mango"</text>
  <rect x="18" y="112" width="68" height="24" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="128" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">"grape"</text>
  <rect x="18" y="142" width="68" height="24" rx="3" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="52" y="158" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">"peach"</text>

  <!-- hash function box -->
  <rect x="118" y="86" width="90" height="36" rx="6" fill="#27272a"/>
  <text x="163" y="102" font-size="9.5" font-weight="700" fill="white" text-anchor="middle">hash(key)</text>
  <text x="163" y="115" font-size="8.5" fill="#a1a1aa" text-anchor="middle">% 7</text>

  <!-- arrows in -->
  <line x1="86" y1="64"  x2="118" y2="98"  stroke="#52525b" stroke-width="1" marker-end="url(#a)"/>
  <line x1="86" y1="94"  x2="118" y2="102" stroke="#52525b" stroke-width="1" marker-end="url(#a)"/>
  <line x1="86" y1="124" x2="118" y2="106" stroke="#52525b" stroke-width="1" marker-end="url(#a)"/>
  <line x1="86" y1="154" x2="118" y2="110" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- arrow out -->
  <line x1="208" y1="104" x2="240" y2="104" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Bucket array (middle) -->
  <text x="283" y="44" font-size="9" fill="#a1a1aa" text-anchor="middle">버킷</text>
  <rect x="248" y="52" width="70" height="24" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="260" y="66" font-size="8.5" fill="#a1a1aa">[0]</text>
  <rect x="248" y="80" width="70" height="24" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="260" y="94" font-size="8.5" fill="#34d399">[1]</text>
  <rect x="248" y="108" width="70" height="24" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="260" y="122" font-size="8.5" fill="#34d399">[2]</text>
  <rect x="248" y="136" width="70" height="24" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="260" y="150" font-size="8.5" fill="#a1a1aa">[3]</text>
  <rect x="248" y="164" width="70" height="24" rx="3" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="178" font-size="8.5" fill="#fcd34d">[4] ← 충돌!</text>

  <!-- values -->
  <line x1="318" y1="92"  x2="352" y2="92"  stroke="#10b981" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="318" y1="120" x2="352" y2="130" stroke="#10b981" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="318" y1="176" x2="352" y2="165" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Values (right) -->
  <text x="440" y="44" font-size="9" fill="#a1a1aa" text-anchor="middle">값</text>
  <rect x="360" y="80" width="60" height="24" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="390" y="96" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">🍎 1.5</text>
  <rect x="360" y="118" width="60" height="24" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="390" y="134" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">🍇 3.0</text>

  <!-- Chaining collision -->
  <rect x="360" y="152" width="60" height="24" rx="3" fill="#33280f" stroke="#f59e0b" stroke-width="1"/>
  <text x="390" y="168" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">🥭 2.0</text>
  <line x1="420" y1="164" x2="438" y2="164" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="446" y="152" width="60" height="24" rx="3" fill="#33280f" stroke="#f59e0b" stroke-width="1"/>
  <text x="476" y="168" font-size="11" font-weight="600" fill="#fafafa" text-anchor="middle">🍑 1.2</text>

  <text x="476" y="185" font-size="8" fill="#fbbf24" text-anchor="middle">체이닝</text>

  <!-- Summary -->
  <text x="300" y="140" font-size="8.5" fill="#a1a1aa" text-anchor="middle">평균 O(1) 접근 · 충돌이 많으면 최악 O(n)</text>
</svg>
