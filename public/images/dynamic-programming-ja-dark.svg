<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">動的計画法 — 最長共通部分列 (LCS)</text>

  <!-- LCS of "ABCD" and "ACBD" -->
  <!-- DP Table -->
  <text x="28" y="44" font-size="9" fill="#a1a1aa" text-anchor="middle">""</text>
  <text x="28" y="68" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">A</text>
  <text x="28" y="92" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">B</text>
  <text x="28" y="116" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">C</text>
  <text x="28" y="140" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">D</text>

  <text x="52"  y="36" font-size="9" fill="#a1a1aa" text-anchor="middle">""</text>
  <text x="82"  y="36" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">A</text>
  <text x="112" y="36" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">C</text>
  <text x="142" y="36" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">B</text>
  <text x="172" y="36" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">D</text>

  <!-- Row 0: all zeros -->
  <rect x="38" y="40" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="52" y="55" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="68" y="40" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="82" y="55" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="98" y="40" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="112" y="55" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="128" y="40" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="142" y="55" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="158" y="40" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="172" y="55" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>

  <!-- Row A: 0 1 1 1 1 -->
  <rect x="38" y="64" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="52" y="79" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="68" y="64" width="28" height="22" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text x="82" y="79" font-size="10" font-weight="700" fill="#fafafa" text-anchor="middle">1</text>
  <rect x="98" y="64" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="112" y="79" font-size="9" fill="#d4d4d8" text-anchor="middle">1</text>
  <rect x="128" y="64" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="142" y="79" font-size="9" fill="#d4d4d8" text-anchor="middle">1</text>
  <rect x="158" y="64" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="172" y="79" font-size="9" fill="#d4d4d8" text-anchor="middle">1</text>

  <!-- Row B: 0 1 1 2 2 -->
  <rect x="38" y="88" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="52" y="103" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="68" y="88" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="82" y="103" font-size="9" fill="#d4d4d8" text-anchor="middle">1</text>
  <rect x="98" y="88" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="112" y="103" font-size="9" fill="#d4d4d8" text-anchor="middle">1</text>
  <rect x="128" y="88" width="28" height="22" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text x="142" y="103" font-size="10" font-weight="700" fill="#fafafa" text-anchor="middle">2</text>
  <rect x="158" y="88" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="172" y="103" font-size="9" fill="#d4d4d8" text-anchor="middle">2</text>

  <!-- Row C: 0 1 2 2 2 -->
  <rect x="38" y="112" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="52" y="127" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="68" y="112" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="82" y="127" font-size="9" fill="#d4d4d8" text-anchor="middle">1</text>
  <rect x="98" y="112" width="28" height="22" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text x="112" y="127" font-size="10" font-weight="700" fill="#fafafa" text-anchor="middle">2</text>
  <rect x="128" y="112" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="142" y="127" font-size="9" fill="#d4d4d8" text-anchor="middle">2</text>
  <rect x="158" y="112" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="172" y="127" font-size="9" fill="#d4d4d8" text-anchor="middle">2</text>

  <!-- Row D: 0 1 2 2 3 -->
  <rect x="38" y="136" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="52" y="151" font-size="9" fill="#a1a1aa" text-anchor="middle">0</text>
  <rect x="68" y="136" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="82" y="151" font-size="9" fill="#d4d4d8" text-anchor="middle">1</text>
  <rect x="98" y="136" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="112" y="151" font-size="9" fill="#d4d4d8" text-anchor="middle">2</text>
  <rect x="128" y="136" width="28" height="22" rx="2" fill="#27272a" stroke="#3f3f46" stroke-width="1"/><text x="142" y="151" font-size="9" fill="#d4d4d8" text-anchor="middle">2</text>
  <rect x="158" y="136" width="28" height="22" rx="2" fill="#14211b" stroke="#10b981" stroke-width="2"/><text x="172" y="151" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">3</text>

  <text x="28" y="172" font-size="8.5" fill="#34d399">LCS = 3</text>
  <text x="28" y="186" font-size="8.5" fill="#a1a1aa">("ABD")</text>

  <!-- Right side: recurrence -->
  <rect x="218" y="28" width="366" height="156" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="400" y="46" font-size="9.5" font-weight="700" fill="#fafafa" text-anchor="middle">DP漸化式</text>

  <rect x="228" y="54" width="346" height="52" rx="4" fill="#27272a"/>
  <text x="400" y="70" font-size="9" fill="#34d399" text-anchor="middle" font-family="monospace">if s1[i] == s2[j]:</text>
  <text x="400" y="84" font-size="9" fill="#a1a1aa" text-anchor="middle" font-family="monospace">  dp[i][j] = dp[i-1][j-1] + 1</text>
  <text x="400" y="98" font-size="9" fill="#60a5fa" text-anchor="middle" font-family="monospace">else:  dp[i][j] = max(dp[i-1][j], dp[i][j-1])</text>

  <text x="228" y="122" font-size="9" fill="#d4d4d8">DPに必要な性質:</text>
  <text x="228" y="137" font-size="8.5" fill="#d4d4d8">① 最適部分構造 — 部分問題の解から全体の解を構築</text>
  <text x="228" y="152" font-size="8.5" fill="#d4d4d8">② 部分問題の重複 — 同じ部分結果を再利用</text>
  <text x="400" y="178" font-size="8.5" fill="#a1a1aa" text-anchor="middle">時間 O(m·n) · 空間 O(m·n) → O(n) に最適化可能</text>
</svg>
