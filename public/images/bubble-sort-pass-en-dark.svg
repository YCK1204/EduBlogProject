<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#f59e0b"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">Bubble Sort — Pass 1 (largest element bubbles to end)</text>

  <!-- Initial array -->
  <text x="30" y="44" font-size="9" fill="#a1a1aa">Start:</text>

  <!-- Helper function for cells -->
  <!-- [5, 3, 8, 1, 4] -->
  <rect x="60" y="32" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="78" y="51" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">5</text>
  <rect x="100" y="32" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="118" y="51" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">3</text>
  <rect x="140" y="32" width="36" height="28" rx="3" fill="#33280f" stroke="#f59e0b" stroke-width="2"/>
  <text x="158" y="51" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">8</text>
  <rect x="180" y="32" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="198" y="51" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">1</text>
  <rect x="220" y="32" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="238" y="51" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">4</text>

  <!-- Step 1: compare 5,3 → swap -->
  <text x="30" y="94" font-size="9" fill="#a1a1aa">Step 1:</text>
  <text x="30" y="106" font-size="8.5" fill="#f87171">swap</text>
  <!-- [3, 5, 8, 1, 4] -->
  <rect x="60" y="82" width="36" height="28" rx="3" fill="#3a1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="101" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">3</text>
  <rect x="100" y="82" width="36" height="28" rx="3" fill="#3a1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="118" y="101" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">5</text>
  <rect x="140" y="82" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="158" y="101" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">8</text>
  <rect x="180" y="82" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="198" y="101" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">1</text>
  <rect x="220" y="82" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="238" y="101" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">4</text>

  <!-- Step 2: 5<8 no swap, 8>1 swap, 8>4 swap → 8 at end -->
  <text x="30" y="144" font-size="9" fill="#a1a1aa">After</text>
  <text x="30" y="156" font-size="9" fill="#a1a1aa">pass 1:</text>
  <!-- [3, 5, 1, 4, 8] -->
  <rect x="60" y="132" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="78" y="151" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">3</text>
  <rect x="100" y="132" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="118" y="151" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">5</text>
  <rect x="140" y="132" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="158" y="151" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">1</text>
  <rect x="180" y="132" width="36" height="28" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="198" y="151" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">4</text>
  <rect x="220" y="132" width="36" height="28" rx="3" fill="#14211b" stroke="#10b981" stroke-width="2"/>
  <text x="238" y="151" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">8</text>
  <text x="238" y="174" font-size="8.5" fill="#34d399" text-anchor="middle">sorted ✓</text>

  <!-- Right side: comparison info -->
  <rect x="290" y="32" width="290" height="150" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="435" y="52" font-size="9.5" font-weight="700" fill="#fafafa" text-anchor="middle">Bubble Sort — Key Facts</text>
  <text x="305" y="72" font-size="9" fill="#d4d4d8">Compare adjacent pairs, swap if out of order.</text>
  <text x="305" y="89" font-size="9" fill="#d4d4d8">After each pass, the largest unsorted element</text>
  <text x="305" y="102" font-size="9" fill="#d4d4d8">reaches its final position (bubbles to end).</text>
  <line x1="305" y1="112" x2="568" y2="112" stroke="#3f3f46" stroke-width="1"/>
  <text x="305" y="128" font-size="9" fill="#d4d4d8">Time:  O(n²) — nested loops</text>
  <text x="305" y="144" font-size="9" fill="#d4d4d8">Space: O(1) — in-place</text>
  <text x="305" y="160" font-size="9" fill="#d4d4d8">Stable: Yes — equal elements keep order</text>
  <text x="305" y="176" font-size="9" fill="#d4d4d8">Best case: O(n) with early-exit optimization</text>
</svg>
