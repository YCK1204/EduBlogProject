<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#52525b"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">TCP/IP 4계층 모델 — 데이터 캡슐화</text>

  <!-- Sending side -->
  <text x="130" y="34" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">송신 (계층별)</text>

  <!-- Application layer -->
  <rect x="40" y="42" width="180" height="24" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="57" font-size="9" font-weight="700" fill="#fafafa" text-anchor="middle">애플리케이션 (HTTP, SMTP, DNS)</text>

  <line x1="130" y1="66" x2="130" y2="78" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Transport layer -->
  <rect x="40" y="78" width="180" height="24" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="93" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">전송 (TCP/UDP 포트)</text>

  <line x1="130" y1="102" x2="130" y2="114" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Internet layer -->
  <rect x="40" y="114" width="180" height="24" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="129" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">인터넷 (IP 주소)</text>

  <line x1="130" y1="138" x2="130" y2="150" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Network Access layer -->
  <rect x="40" y="150" width="180" height="24" rx="4" fill="#3a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="130" y="165" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">네트워크 접근 (Ethernet, WiFi)</text>

  <!-- Packet structure -->
  <text x="420" y="34" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">최종 패킷 구조</text>

  <!-- Layered headers -->
  <rect x="320" y="54" width="50" height="20" rx="2" fill="#3a1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="345" y="67" font-size="8" fill="#fca5a5" text-anchor="middle">MAC</text>
  <rect x="374" y="54" width="40" height="20" rx="2" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="394" y="67" font-size="8" fill="#6ee7b7" text-anchor="middle">IP</text>
  <rect x="418" y="54" width="40" height="20" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="438" y="67" font-size="8" fill="#93c5fd" text-anchor="middle">TCP</text>
  <rect x="462" y="54" width="80" height="20" rx="2" fill="#33280f" stroke="#f59e0b" stroke-width="1"/>
  <text x="502" y="67" font-size="8" fill="#fafafa" text-anchor="middle">HTTP 데이터</text>

  <!-- Labels -->
  <text x="345" y="82" font-size="7" fill="#f87171" text-anchor="middle">1계층</text>
  <text x="394" y="82" font-size="7" fill="#34d399" text-anchor="middle">3계층</text>
  <text x="438" y="82" font-size="7" fill="#60a5fa" text-anchor="middle">4계층</text>
  <text x="502" y="82" font-size="7" fill="#fbbf24" text-anchor="middle">7계층</text>

  <!-- Example protocols per layer -->
  <rect x="320" y="102" width="260" height="76" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="450" y="118" font-size="8.5" font-weight="700" fill="#fafafa" text-anchor="middle">계층별 주요 프로토콜</text>

  <text x="330" y="134" font-size="8" fill="#fbbf24" font-weight="700">애플리케이션:</text>
  <text x="400" y="134" font-size="8" fill="#d4d4d8">HTTP/HTTPS, SMTP, FTP, SSH, DNS</text>

  <text x="330" y="148" font-size="8" fill="#60a5fa" font-weight="700">전송:</text>
  <text x="385" y="148" font-size="8" fill="#d4d4d8">TCP (신뢰성), UDP (빠름)</text>

  <text x="330" y="162" font-size="8" fill="#34d399" font-weight="700">인터넷:</text>
  <text x="375" y="162" font-size="8" fill="#d4d4d8">IPv4, IPv6, ICMP</text>

  <text x="330" y="176" font-size="8" fill="#f87171" font-weight="700">네트워크 접근:</text>
  <text x="415" y="176" font-size="8" fill="#d4d4d8">Ethernet, WiFi, PPP</text>

  <text x="300" y="196" font-size="8.5" fill="#a1a1aa" text-anchor="middle">각 계층이 헤더를 추가 — 수신 측은 역순으로 처리</text>
</svg>
