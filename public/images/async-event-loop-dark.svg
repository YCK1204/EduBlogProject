<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">이벤트 루프 — 비동기 실행</text>

  <!-- Call Stack -->
  <text x="80" y="34" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">호출 스택</text>
  <rect x="20" y="42" width="120" height="100" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  
  <rect x="30" y="48" width="100" height="18" rx="2" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  <text x="80" y="60" font-size="8" text-anchor="middle">main()</text>
  
  <rect x="30" y="70" width="100" height="18" rx="2" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="80" y="82" font-size="8" text-anchor="middle">processData()</text>

  <!-- Event Queue -->
  <text x="240" y="34" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">이벤트 큐 (콜백)</text>
  <rect x="160" y="42" width="160" height="44" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  
  <rect x="170" y="50" width="70" height="14" rx="2" fill="#3a1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="205" y="60" font-size="7" text-anchor="middle">timeout 콜백</text>
  
  <rect x="245" y="50" width="70" height="14" rx="2" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="280" y="60" font-size="7" text-anchor="middle">fetch 콜백</text>
  
  <rect x="170" y="68" width="70" height="14" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="205" y="78" font-size="7" text-anchor="middle">click 콜백</text>

  <!-- Web APIs -->
  <text x="240" y="104" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">웹 API / Node API</text>
  <rect x="160" y="112" width="160" height="64" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  
  <text x="170" y="128" font-size="8" fill="#6ee7b7">setTimeout(cb, 1000)</text>
  <text x="170" y="142" font-size="8" fill="#6ee7b7">fetch('/api/data')</text>
  <text x="170" y="156" font-size="8" fill="#6ee7b7">fs.readFile(path, cb)</text>
  <text x="170" y="170" font-size="8" fill="#6ee7b7">addEventListener('click', cb)</text>

  <!-- Event Loop -->
  <circle cx="400" cy="95" r="40" fill="#3a1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="92" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">이벤트</text>
  <text x="400" y="104" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">루프</text>

  <!-- Arrows -->
  <path d="M 140 70 Q 180 40 220 70" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="180" y="45" font-size="7" fill="#60a5fa" text-anchor="middle">비동기 호출</text>

  <path d="M 320 125 Q 350 105 360 95" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="345" y="120" font-size="7" fill="#fbbf24" text-anchor="middle">준비됨</text>

  <path d="M 360 85 Q 320 50 290 55" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>
  <text x="325" y="60" font-size="7" fill="#f87171" text-anchor="middle">큐에 추가</text>

  <path d="M 160 55 Q 120 35 100 55" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>
  <text x="130" y="40" font-size="7" fill="#f87171" text-anchor="middle">실행</text>

  <text x="500" y="60" font-size="8.5" fill="#a1a1aa">단일 스레드</text>
  <text x="500" y="74" font-size="8.5" fill="#a1a1aa">논블로킹 I/O</text>
  <text x="500" y="120" font-size="8.5" fill="#a1a1aa">스택이 비면</text>
  <text x="500" y="134" font-size="8.5" fill="#a1a1aa">콜백 실행</text>

  <text x="300" y="192" font-size="8.5" fill="#a1a1aa" text-anchor="middle">JavaScript, Node.js — 이벤트 기반 구조를 통한 동시성</text>
</svg>
