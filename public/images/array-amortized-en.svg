<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="680" height="190" fill="#fafafa" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">Cost per append (including resizes)</text>

  <line x1="50" y1="24" x2="50" y2="154" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="44" y="28"  font-size="8" fill="#a1a1aa" text-anchor="end">16</text>
  <text x="44" y="60"  font-size="8" fill="#a1a1aa" text-anchor="end">8</text>
  <text x="44" y="92"  font-size="8" fill="#a1a1aa" text-anchor="end">4</text>
  <text x="44" y="124" font-size="8" fill="#a1a1aa" text-anchor="end">2</text>
  <text x="44" y="154" font-size="8" fill="#a1a1aa" text-anchor="end">1</text>

  <line x1="50" y1="28"  x2="570" y2="28"  stroke="#f0f0f0" stroke-width="1"/>
  <line x1="50" y1="60"  x2="570" y2="60"  stroke="#f0f0f0" stroke-width="1"/>
  <line x1="50" y1="92"  x2="570" y2="92"  stroke="#f0f0f0" stroke-width="1"/>
  <line x1="50" y1="124" x2="570" y2="124" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="50" y1="154" x2="570" y2="154" stroke="#d4d4d8" stroke-width="1.5"/>

  <!-- Bars: cost=1 → height 10, cost=2 → 20, cost=4 → 40, cost=8 → 80, cost=16 → 126 (capped) -->
  <!-- i=1 cost=1 -->
  <rect x="56"  y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="69"  y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">1</text>
  <!-- i=2 cost=2 resize -->
  <rect x="88"  y="134" width="26" height="20" rx="2" fill="#f59e0b"/>
  <text x="101" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">2</text>
  <!-- i=3 cost=1 -->
  <rect x="120" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="133" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">3</text>
  <!-- i=4 cost=4 resize -->
  <rect x="152" y="114" width="26" height="40" rx="2" fill="#f59e0b"/>
  <text x="165" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">4</text>
  <!-- i=5,6,7 cost=1 -->
  <rect x="184" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="197" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">5</text>
  <rect x="216" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="229" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">6</text>
  <rect x="248" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="261" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">7</text>
  <!-- i=8 cost=8 resize -->
  <rect x="280" y="74"  width="26" height="80" rx="2" fill="#f59e0b"/>
  <text x="293" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">8</text>
  <!-- i=9..15 cost=1 -->
  <rect x="312" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="325" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">9</text>
  <rect x="344" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="357" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">10</text>
  <rect x="376" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="389" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">11</text>
  <rect x="408" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="421" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">12</text>
  <rect x="440" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="453" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">13</text>
  <rect x="472" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="485" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">14</text>
  <rect x="504" y="144" width="26" height="10" rx="2" fill="#71717a"/>
  <text x="517" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">15</text>
  <!-- i=16 cost=16 resize (capped) -->
  <rect x="536" y="28"  width="26" height="126" rx="2" fill="#f59e0b"/>
  <text x="549" y="165" font-size="7.5" fill="#a1a1aa" text-anchor="middle">16</text>

  <!-- Average line -->
  <line x1="50" y1="134" x2="570" y2="134" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="585" y="137" font-size="10" fill="#10b981" font-weight="700">avg ≈ 2</text>

  <!-- Legend -->
  <rect x="56"  y="174" width="12" height="8" rx="1" fill="#71717a"/>
  <text x="72"  y="182" font-size="8.5" fill="#52525b">normal append O(1)</text>
  <rect x="210" y="174" width="12" height="8" rx="1" fill="#f59e0b"/>
  <text x="226" y="182" font-size="8.5" fill="#52525b">resize triggered</text>
  <text x="400" y="182" font-size="8.5" fill="#10b981" font-weight="600">amortized average → O(1)*</text>
</svg>
