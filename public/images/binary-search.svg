<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#fafafa" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">이진 탐색 — 정렬된 배열에서 목표값 = 33 찾기</text>

  <!-- Sorted array: [2, 8, 13, 21, 33, 47, 58, 72, 91] — 9 elements -->
  <!-- index labels -->
  <text x="40"  y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">0</text>
  <text x="100" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">1</text>
  <text x="160" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">2</text>
  <text x="220" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">3</text>
  <text x="280" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">4</text>
  <text x="340" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">5</text>
  <text x="400" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">6</text>
  <text x="460" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">7</text>
  <text x="520" y="42" font-size="8" fill="#a1a1aa" text-anchor="middle">8</text>

  <!-- cells -->
  <rect x="16"  y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="40"  y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">2</text>
  <rect x="76"  y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="100" y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">8</text>
  <rect x="136" y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="160" y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">13</text>
  <rect x="196" y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="220" y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">21</text>
  <rect x="256" y="48" width="48" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="280" y="68" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">33</text>
  <rect x="316" y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="340" y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">47</text>
  <rect x="376" y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="400" y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">58</text>
  <rect x="436" y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="460" y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">72</text>
  <rect x="496" y="48" width="48" height="30" rx="3" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="520" y="68" font-size="12" fill="#a1a1aa" text-anchor="middle">91</text>

  <!-- Step 1: lo=0, hi=8, mid=4, arr[4]=33 → found! -->
  <text x="30" y="102" font-size="9" fill="#52525b" font-weight="700">1단계:</text>
  <text x="30" y="115" font-size="8.5" fill="#3b82f6">lo=0  hi=8  mid=4</text>
  <!-- lo pointer -->
  <line x1="40" y1="78" x2="40" y2="93" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="40" y="100" font-size="8" fill="#3b82f6" text-anchor="middle">lo</text>
  <!-- hi pointer -->
  <line x1="520" y1="78" x2="520" y2="93" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="100" font-size="8" fill="#3b82f6" text-anchor="middle">hi</text>
  <!-- mid pointer -->
  <line x1="280" y1="78" x2="280" y2="93" stroke="#10b981" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="100" font-size="8" fill="#10b981" text-anchor="middle">mid</text>

  <text x="30" y="132" font-size="8.5" fill="#10b981">arr[mid]=33 == target → 인덱스 4에서 발견! ✓</text>

  <!-- Complexity comparison -->
  <rect x="16" y="146" width="565" height="36" rx="5" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="298" y="160" font-size="9.5" font-weight="700" fill="#18181b" text-anchor="middle">왜 O(log n)일까?   매 단계마다 탐색 범위가 절반으로 줄어든다</text>
  <text x="298" y="176" font-size="8.5" fill="#52525b" text-anchor="middle">선형 탐색: 최대 9번 비교 · 이진 탐색: 최대 ⌈log₂ 9⌉ = 4번 비교</text>
</svg>
