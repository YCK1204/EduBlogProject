<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#fafafa" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">Operating System — Abstraction Layers</text>

  <!-- Hardware layer (bottom) -->
  <rect x="40" y="150" width="520" height="28" rx="4" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="300" y="169" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">Hardware (CPU, Memory, Disk, Network)</text>

  <!-- OS Kernel layer -->
  <rect x="40" y="114" width="520" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="135" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">Operating System Kernel</text>

  <!-- System calls interface -->
  <rect x="60" y="90" width="160" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="140" y="104" font-size="8.5" fill="#1e40af" text-anchor="middle">File System API</text>

  <rect x="240" y="90" width="160" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="320" y="104" font-size="8.5" fill="#1e40af" text-anchor="middle">Process Management</text>

  <rect x="420" y="90" width="120" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="480" y="104" font-size="8.5" fill="#1e40af" text-anchor="middle">Memory Manager</text>

  <!-- Applications layer (top) -->
  <rect x="60" y="42" width="110" height="40" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="60" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Applications</text>
  <text x="115" y="74" font-size="8" fill="#10b981" text-anchor="middle">Browser, Editor</text>

  <rect x="190" y="42" width="110" height="40" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="245" y="60" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">System Tools</text>
  <text x="245" y="74" font-size="8" fill="#10b981" text-anchor="middle">Terminal, ls, ps</text>

  <rect x="320" y="42" width="110" height="40" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="375" y="60" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Services</text>
  <text x="375" y="74" font-size="8" fill="#10b981" text-anchor="middle">Database, Web</text>

  <rect x="450" y="42" width="110" height="40" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="505" y="60" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">User Programs</text>
  <text x="505" y="74" font-size="8" fill="#10b981" text-anchor="middle">Games, Scripts</text>

  <!-- Labels -->
  <text x="16" y="63" font-size="8.5" fill="#10b981" text-anchor="middle" transform="rotate(-90,16,63)">User Space</text>
  <text x="16" y="103" font-size="8.5" fill="#3b82f6" text-anchor="middle" transform="rotate(-90,16,103)">System Calls</text>
  <text x="16" y="130" font-size="8.5" fill="#f59e0b" text-anchor="middle" transform="rotate(-90,16,130)">Kernel Space</text>
  <text x="16" y="164" font-size="8.5" fill="#a1a1aa" text-anchor="middle" transform="rotate(-90,16,164)">Hardware</text>

  <text x="300" y="26" font-size="8.5" fill="#a1a1aa" text-anchor="middle">OS provides abstraction — programs don't need to know hardware details</text>
</svg>
