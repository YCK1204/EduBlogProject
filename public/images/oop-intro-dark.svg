<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">객체 지향 프로그래밍 — 클래스와 인스턴스</text>

  <!-- Class definition (left) -->
  <text x="130" y="34" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">클래스 (설계도)</text>

  <rect x="20" y="40" width="220" height="110" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="58" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">Car</text>
  
  <!-- Attributes -->
  <text x="30" y="76" font-size="8.5" fill="#6ee7b7" font-weight="700">속성:</text>
  <text x="30" y="90" font-size="8" fill="#d4d4d8">• make: string</text>
  <text x="30" y="102" font-size="8" fill="#d4d4d8">• model: string</text>
  <text x="30" y="114" font-size="8" fill="#d4d4d8">• year: number</text>
  <text x="30" y="126" font-size="8" fill="#d4d4d8">• speed: number</text>

  <!-- Methods -->
  <text x="140" y="76" font-size="8.5" fill="#fca5a5" font-weight="700">메서드:</text>
  <text x="140" y="90" font-size="8" fill="#d4d4d8">• start()</text>
  <text x="140" y="102" font-size="8" fill="#d4d4d8">• accelerate()</text>
  <text x="140" y="114" font-size="8" fill="#d4d4d8">• brake()</text>
  <text x="140" y="126" font-size="8" fill="#d4d4d8">• stop()</text>

  <!-- Arrow -->
  <text x="300" y="90" font-size="12" fill="#a1a1aa" text-anchor="middle">→</text>
  <text x="300" y="106" font-size="8" fill="#a1a1aa" text-anchor="middle">인스턴스화</text>

  <!-- Instances (right) -->
  <text x="470" y="34" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">인스턴스 (객체)</text>

  <!-- Instance 1 -->
  <rect x="360" y="42" width="120" height="62" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="58" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">car1</text>
  <text x="370" y="74" font-size="7.5" fill="#d4d4d8">make: "Toyota"</text>
  <text x="370" y="86" font-size="7.5" fill="#d4d4d8">model: "Camry"</text>
  <text x="370" y="98" font-size="7.5" fill="#d4d4d8">year: 2020, speed: 0</text>

  <!-- Instance 2 -->
  <rect x="360" y="110" width="120" height="62" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="126" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">car2</text>
  <text x="370" y="142" font-size="7.5" fill="#d4d4d8">make: "Honda"</text>
  <text x="370" y="154" font-size="7.5" fill="#d4d4d8">model: "Civic"</text>
  <text x="370" y="166" font-size="7.5" fill="#d4d4d8">year: 2019, speed: 45</text>

  <!-- Instance 3 -->
  <rect x="490" y="76" width="90" height="62" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="535" y="92" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">car3</text>
  <text x="495" y="108" font-size="7.5" fill="#d4d4d8">make: "BMW"</text>
  <text x="495" y="120" font-size="7.5" fill="#d4d4d8">model: "X5"</text>
  <text x="495" y="132" font-size="7.5" fill="#d4d4d8">year: 2022</text>

  <text x="300" y="182" font-size="8.5" fill="#a1a1aa" text-anchor="middle">각 인스턴스는 고유한 상태를 갖지만 동일한 동작(메서드)을 공유한다</text>
</svg>
