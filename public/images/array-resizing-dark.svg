<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="210" fill="#18181b" rx="10"/>
  <defs>
    <marker id="arrowDown" markerWidth="7" markerHeight="7" refX="3.5" refY="0" orient="auto">
      <path d="M0,0 L7,0 L3.5,6 z" fill="#52525b"/>
    </marker>
  </defs>

  <text x="20" y="18" font-size="9" font-weight="700" fill="#a1a1aa">① 가득 참 — E 추가 요청</text>
  <text x="20" y="90" font-size="9" font-weight="700" fill="#a1a1aa">② 2× 버퍼 할당 + 복사</text>
  <text x="20" y="160" font-size="9" font-weight="700" fill="#a1a1aa">③ E 추가 완료</text>

  <!-- Step 1 -->
  <rect x="20"  y="22" width="46" height="36" rx="3" fill="#3a1a1a" stroke="#f87171" stroke-width="1.5"/>
  <text x="43"  y="42" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">A</text>
  <rect x="70"  y="22" width="46" height="36" rx="3" fill="#3a1a1a" stroke="#f87171" stroke-width="1.5"/>
  <text x="93"  y="42" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">B</text>
  <rect x="120" y="22" width="46" height="36" rx="3" fill="#3a1a1a" stroke="#f87171" stroke-width="1.5"/>
  <text x="143" y="42" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">C</text>
  <rect x="170" y="22" width="46" height="36" rx="3" fill="#3a1a1a" stroke="#f87171" stroke-width="1.5"/>
  <text x="193" y="42" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">D</text>
  <text x="228" y="38" font-size="18" fill="#f87171">+</text>
  <rect x="244" y="22" width="46" height="36" rx="3" fill="#18181b" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="267" y="42" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">E</text>
  <text x="310" y="36" font-size="9" fill="#f87171">← 공간 없음!</text>
  <text x="43" y="68" font-size="8.5" fill="#a1a1aa">cap=4, size=4</text>

  <line x1="120" y1="74" x2="120" y2="92" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 2 -->
  <rect x="20"  y="96" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="43"  y="116" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">A</text>
  <rect x="70"  y="96" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="93"  y="116" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">B</text>
  <rect x="120" y="96" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="143" y="116" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">C</text>
  <rect x="170" y="96" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="193" y="116" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">D</text>
  <rect x="220" y="96" width="46" height="36" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="270" y="96" width="46" height="36" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="320" y="96" width="46" height="36" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="370" y="96" width="46" height="36" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="100" y="142" font-size="8.5" fill="#a1a1aa">새 버퍼 cap=8 (×2)</text>

  <line x1="120" y1="146" x2="120" y2="162" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Step 3 -->
  <rect x="20"  y="164" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="43"  y="184" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">A</text>
  <rect x="70"  y="164" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="93"  y="184" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">B</text>
  <rect x="120" y="164" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="143" y="184" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">C</text>
  <rect x="170" y="164" width="46" height="36" rx="3" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="193" y="184" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">D</text>
  <rect x="220" y="164" width="46" height="36" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="243" y="184" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">E</text>
  <rect x="270" y="164" width="46" height="36" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="320" y="164" width="46" height="36" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="370" y="164" width="46" height="36" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="100" y="210" font-size="8.5" fill="#93c5fd">size=5, cap=8</text>

  <!-- Summary -->
  <rect x="430" y="22" width="154" height="174" rx="6" fill="#33280f" stroke="#f59e0b" stroke-width="1"/>
  <text x="507" y="44" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="middle">크기 조정 비용</text>
  <text x="507" y="62" font-size="9" fill="#fcd34d" text-anchor="middle">할당: O(1)</text>
  <text x="507" y="78" font-size="9" fill="#fcd34d" text-anchor="middle">n개 항목 복사: O(n)</text>
  <text x="507" y="94" font-size="9" fill="#fcd34d" text-anchor="middle">E 삽입: O(1)</text>
  <line x1="444" y1="104" x2="570" y2="104" stroke="#fde68a" stroke-width="1"/>
  <text x="507" y="122" font-size="9" fill="#fbbf24" text-anchor="middle">2× 증가로 크기 조정을</text>
  <text x="507" y="138" font-size="9" fill="#fbbf24" text-anchor="middle">드물게 유지</text>
  <line x1="444" y1="152" x2="570" y2="152" stroke="#fde68a" stroke-width="1"/>
  <text x="507" y="170" font-size="9.5" font-weight="700" fill="#fcd34d" text-anchor="middle">분할 상환: O(1)*</text>
</svg>
