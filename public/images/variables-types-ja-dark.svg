<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">変数とデータ型 — 静的型付け vs 動的型付け</text>

  <!-- Static typing (left) -->
  <text x="150" y="34" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">静的型付け (コンパイル時)</text>

  <rect x="20" y="42" width="260" height="76" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="25" y="47" width="250" height="66" rx="3" fill="#27272a"/>
  
  <text x="30" y="62" font-size="9" fill="#22d3ee" font-family="monospace">int age = 25;</text>
  <text x="30" y="78" font-size="9" fill="#a78bfa" font-family="monospace">string name = "John";</text>
  <text x="30" y="94" font-size="9" fill="#fb7185" font-family="monospace">bool active = true;</text>
  <text x="30" y="108" font-size="8" fill="#f87171" font-family="monospace">// age = "hello";  ← コンパイルエラー!</text>

  <!-- Dynamic typing (right) -->
  <text x="450" y="34" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">動的型付け (実行時)</text>

  <rect x="320" y="42" width="260" height="76" rx="5" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="325" y="47" width="250" height="66" rx="3" fill="#27272a"/>
  
  <text x="330" y="62" font-size="9" fill="#22d3ee" font-family="monospace">age = 25</text>
  <text x="330" y="78" font-size="9" fill="#a78bfa" font-family="monospace">name = "John"</text>
  <text x="330" y="94" font-size="9" fill="#fb7185" font-family="monospace">active = True</text>
  <text x="330" y="108" font-size="8" fill="#34d399" font-family="monospace"># age = "hello"  ← 実行時に動作する</text>

  <!-- Type checking comparison -->
  <rect x="20" y="130" width="560" height="58" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="300" y="148" font-size="9" font-weight="700" fill="#fafafa" text-anchor="middle">トレードオフ</text>

  <!-- Static column -->
  <text x="150" y="162" font-size="8.5" font-weight="700" fill="#60a5fa" text-anchor="middle">静的型付け</text>
  <text x="80" y="176" font-size="8" fill="#34d399">✓ エラーを早期に検出</text>
  <text x="220" y="176" font-size="8" fill="#34d399">✓ 優れたツール/IDE 支援</text>

  <!-- Dynamic column -->
  <text x="450" y="162" font-size="8.5" font-weight="700" fill="#fbbf24" text-anchor="middle">動的型付け</text>
  <text x="380" y="176" font-size="8" fill="#34d399">✓ 試作が速い</text>
  <text x="520" y="176" font-size="8" fill="#34d399">✓ 柔軟性が高い</text>

  <text x="300" y="196" font-size="8.5" fill="#a1a1aa" text-anchor="middle">例: 静的 (C++, Java, Rust) · 動的 (Python, JavaScript, Ruby)</text>
</svg>
