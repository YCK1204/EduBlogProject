<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="160" fill="#fafafa" rx="10"/>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#71717a"/>
    </marker>
    <marker id="null" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#d4d4d8"/>
    </marker>
  </defs>

  <text x="300" y="18" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">単方向連結リスト — 各ノードはデータ + 次へのポインタを保持</text>

  <!-- head pointer -->
  <text x="30" y="62" font-size="9" fill="#f59e0b" font-weight="700">head</text>
  <line x1="30" y1="66" x2="52" y2="74" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 1 -->
  <rect x="60" y="52" width="56" height="36" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="116" y="52" width="40" height="36" rx="4" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="88" y="72" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <text x="136" y="68" font-size="8" fill="#52525b" text-anchor="middle">next</text>
  <line x1="156" y1="70" x2="200" y2="70" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 2 -->
  <rect x="208" y="52" width="56" height="36" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="264" y="52" width="40" height="36" rx="4" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="236" y="72" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">25</text>
  <text x="284" y="68" font-size="8" fill="#52525b" text-anchor="middle">next</text>
  <line x1="304" y1="70" x2="348" y2="70" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 3 -->
  <rect x="356" y="52" width="56" height="36" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="412" y="52" width="40" height="36" rx="4" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  <text x="384" y="72" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">47</text>
  <text x="432" y="68" font-size="8" fill="#52525b" text-anchor="middle">next</text>
  <line x1="452" y1="70" x2="496" y2="70" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 4 + null -->
  <rect x="504" y="52" width="56" height="36" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <rect x="560" y="52" width="30" height="36" rx="4" fill="#e4e4e7" stroke="#d4d4d8" stroke-width="1"/>
  <text x="532" y="72" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">63</text>
  <text x="575" y="70" font-size="8" fill="#a1a1aa" text-anchor="middle">∅</text>

  <!-- Labels -->
  <text x="88"  y="100" font-size="8.5" fill="#a1a1aa" text-anchor="middle">ノード 1</text>
  <text x="236" y="100" font-size="8.5" fill="#a1a1aa" text-anchor="middle">ノード 2</text>
  <text x="384" y="100" font-size="8.5" fill="#a1a1aa" text-anchor="middle">ノード 3</text>
  <text x="532" y="100" font-size="8.5" fill="#a1a1aa" text-anchor="middle">ノード 4</text>

  <!-- VS array comparison -->
  <line x1="20" y1="115" x2="580" y2="115" stroke="#e4e4e7" stroke-width="1"/>
  <text x="300" y="132" font-size="9" fill="#a1a1aa" text-anchor="middle">非連続なメモリ  ·  アクセス O(n)  ·  挿入/削除 O(1)*  ·  インデックス参照不可</text>
  <text x="300" y="148" font-size="8.5" fill="#a1a1aa" text-anchor="middle">* その位置への参照を既に持っている場合</text>
</svg>
