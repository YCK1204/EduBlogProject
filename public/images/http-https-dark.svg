<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <marker id="r" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#ef4444"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">HTTP vs HTTPS — 요청-응답 흐름</text>

  <!-- Client -->
  <rect x="40" y="42" width="60" height="40" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="60" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">클라이언트</text>
  <text x="70" y="74" font-size="8" fill="#60a5fa" text-anchor="middle">(브라우저)</text>

  <!-- Server -->
  <rect x="500" y="42" width="60" height="40" rx="5" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="530" y="60" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">서버</text>
  <text x="530" y="74" font-size="8" fill="#34d399" text-anchor="middle">(웹 앱)</text>

  <!-- HTTP (plain) -->
  <text x="200" y="104" font-size="9" font-weight="700" fill="#f87171" text-anchor="middle">HTTP — 평문 (포트 80)</text>
  <line x1="100" y1="112" x2="480" y2="112" stroke="#ef4444" stroke-width="2" marker-end="url(#r)" stroke-dasharray="8,4"/>
  <text x="290" y="106" font-size="8" fill="#f87171" text-anchor="middle">GET /api/user  (암호화 안 됨)</text>

  <line x1="480" y1="124" x2="100" y2="124" stroke="#ef4444" stroke-width="2" marker-end="url(#r)" stroke-dasharray="8,4"/>
  <text x="290" y="139" font-size="8" fill="#f87171" text-anchor="middle">200 OK {"name": "John"}  (공격자에게 노출)</text>

  <!-- HTTPS (encrypted) -->
  <text x="200" y="154" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">HTTPS — 암호화됨 (포트 443)</text>
  <line x1="100" y1="162" x2="480" y2="162" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="156" font-size="8" fill="#60a5fa" text-anchor="middle">GET /api/user  (TLS 암호화)</text>

  <line x1="480" y1="174" x2="100" y2="174" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="189" font-size="8" fill="#60a5fa" text-anchor="middle">200 OK {"name": "John"}  (보안 전송)</text>

  <!-- Security indicators -->
  <circle cx="170" cy="104" r="8" fill="#3a1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="170" y="109" font-size="10" fill="#f87171" text-anchor="middle">!</text>

  <circle cx="170" cy="154" r="8" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="170" y="159" font-size="10" fill="#34d399" text-anchor="middle">🔒</text>
</svg>
