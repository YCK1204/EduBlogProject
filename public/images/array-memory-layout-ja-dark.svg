<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="140" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">配列のメモリレイアウト</text>

  <!-- Memory cells -->
  <rect x="80" y="32" width="80" height="40" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="48" font-size="9" fill="#93c5fd" text-anchor="middle">index[0]</text>
  <text x="120" y="60" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">42</text>
  <text x="120" y="80" font-size="7" fill="#60a5fa" text-anchor="middle">0x1000</text>

  <rect x="160" y="32" width="80" height="40" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="48" font-size="9" fill="#93c5fd" text-anchor="middle">index[1]</text>
  <text x="200" y="60" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">17</text>
  <text x="200" y="80" font-size="7" fill="#60a5fa" text-anchor="middle">0x1004</text>

  <rect x="240" y="32" width="80" height="40" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="48" font-size="9" fill="#93c5fd" text-anchor="middle">index[2]</text>
  <text x="280" y="60" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">93</text>
  <text x="280" y="80" font-size="7" fill="#60a5fa" text-anchor="middle">0x1008</text>

  <rect x="320" y="32" width="80" height="40" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="48" font-size="9" fill="#93c5fd" text-anchor="middle">index[3]</text>
  <text x="360" y="60" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">56</text>
  <text x="360" y="80" font-size="7" fill="#60a5fa" text-anchor="middle">0x100C</text>

  <rect x="400" y="32" width="80" height="40" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="440" y="48" font-size="9" fill="#93c5fd" text-anchor="middle">index[4]</text>
  <text x="440" y="60" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">81</text>
  <text x="440" y="80" font-size="7" fill="#60a5fa" text-anchor="middle">0x1010</text>

  <!-- Formula box -->
  <rect x="100" y="90" width="400" height="38" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="300" y="106" font-size="8.5" font-weight="700" fill="#fafafa" text-anchor="middle">メモリアドレスの計算式（4バイト整数の場合）</text>
  <text x="300" y="120" font-size="8.5" fill="#d4d4d8" text-anchor="middle" font-family="monospace">address = base_address + (index × sizeof(element))</text>
</svg>
