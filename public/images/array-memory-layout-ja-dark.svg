<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- 배경 -->
  <rect width="800" height="220" fill="#0f172a" rx="12"/>

  <!-- 제목 -->
  <text x="400" y="30" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">配列のメモリレイアウト</text>
  
  <!-- 배열 라벨 -->
  <text x="60" y="70" font-size="14" font-weight="600" fill="#94a3b8">int arr[5]</text>
  
  <!-- 메모리 셀들 -->
  <g id="memory-cells">
    <!-- 인덱스 0 -->
    <rect x="120" y="85" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="170" y="108" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">42</text>
    <text x="170" y="125" font-size="12" fill="#94a3b8" text-anchor="middle">インデックス [0]</text>
    <text x="170" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">0x1000</text>
    
    <!-- 인덱스 1 -->
    <rect x="230" y="85" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="280" y="108" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">78</text>
    <text x="280" y="125" font-size="12" fill="#94a3b8" text-anchor="middle">インデックス [1]</text>
    <text x="280" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">0x1004</text>
    
    <!-- 인덱스 2 -->
    <rect x="340" y="85" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="390" y="108" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">13</text>
    <text x="390" y="125" font-size="12" fill="#94a3b8" text-anchor="middle">インデックス [2]</text>
    <text x="390" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">0x1008</text>
    
    <!-- 인덱스 3 -->
    <rect x="450" y="85" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="500" y="108" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">91</text>
    <text x="500" y="125" font-size="12" fill="#94a3b8" text-anchor="middle">インデックス [3]</text>
    <text x="500" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">0x100C</text>
    
    <!-- 인덱스 4 -->
    <rect x="560" y="85" width="100" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="610" y="108" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">5</text>
    <text x="610" y="125" font-size="12" fill="#94a3b8" text-anchor="middle">インデックス [4]</text>
    <text x="610" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">0x1010</text>
  </g>
  
  <!-- 연속성을 나타내는 화살표 -->
  <path d="M 220 117 L 230 117" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 330 117 L 340 117" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 440 117 L 450 117" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 550 117 L 560 117" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 공식 박스 -->
  <rect x="120" y="185" width="560" height="25" rx="6" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="400" y="202" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="monospace">アドレス = ベースアドレス + (インデックス × 4バイト)</text>
  
  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>