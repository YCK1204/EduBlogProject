<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#52525b"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">병합 정렬 — [38, 27, 43, 3]에 대한 분할 정복</text>

  <!-- Level 0: full array -->
  <rect x="200" y="24" width="200" height="26" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="41" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">38  27  43  3</text>

  <!-- arrows down to split -->
  <line x1="250" y1="50" x2="190" y2="72" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="50" x2="410" y2="72" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Level 1: two halves -->
  <rect x="120" y="72" width="120" height="26" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="180" y="89" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">38  27</text>

  <rect x="360" y="72" width="120" height="26" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="420" y="89" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">43  3</text>

  <!-- arrows down -->
  <line x1="160" y1="98" x2="116" y2="120" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="98" x2="224" y2="120" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="400" y1="98" x2="356" y2="120" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="98" x2="484" y2="120" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Level 2: individual elements -->
  <rect x="82" y="120" width="48" height="26" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="106" y="137" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">38</text>
  <rect x="200" y="120" width="48" height="26" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="224" y="137" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">27</text>
  <rect x="330" y="120" width="48" height="26" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="354" y="137" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">43</text>
  <rect x="452" y="120" width="48" height="26" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="476" y="137" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">3</text>

  <!-- arrows up: merge -->
  <line x1="116" y1="146" x2="160" y2="162" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="224" y1="146" x2="200" y2="162" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="354" y1="146" x2="398" y2="162" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="476" y1="146" x2="432" y2="162" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Level 1 merged -->
  <rect x="120" y="162" width="120" height="26" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="180" y="179" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">27  38</text>
  <rect x="360" y="162" width="120" height="26" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="179" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">3  43</text>

  <!-- labels -->
  <text x="20" y="38" font-size="8.5" fill="#a1a1aa">분할</text>
  <text x="20" y="58" font-size="8.5" fill="#a1a1aa">↓</text>
  <text x="20" y="134" font-size="8.5" fill="#34d399">병합</text>
  <text x="20" y="154" font-size="8.5" fill="#34d399">↑</text>
  <text x="300" y="196" font-size="8.5" fill="#a1a1aa" text-anchor="middle">최종 병합 → [3, 27, 38, 43]  ·  시간 O(n log n)  ·  공간 O(n)</text>
</svg>
