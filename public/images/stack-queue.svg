<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#fafafa" rx="10"/>
  <defs>
    <marker id="au" markerWidth="7" markerHeight="7" refX="3.5" refY="7" orient="auto"><path d="M0,7 L3.5,0 L7,7 z" fill="#f59e0b"/></marker>
    <marker id="ad" markerWidth="7" markerHeight="7" refX="3.5" refY="0" orient="auto"><path d="M0,0 L7,0 L3.5,7 z" fill="#f59e0b"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="0" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#f87171"/></marker>
  </defs>

  <!-- Stack (left) -->
  <text x="130" y="16" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">스택 — LIFO</text>
  <text x="130" y="30" font-size="9" fill="#a1a1aa" text-anchor="middle">후입선출 (Last In, First Out)</text>

  <!-- push arrow -->
  <line x1="72" y1="46" x2="72" y2="62" stroke="#f59e0b" stroke-width="2" marker-end="url(#ad)"/>
  <text x="58" y="58" font-size="8.5" fill="#f59e0b">push</text>
  <!-- pop arrow -->
  <line x1="188" y1="62" x2="188" y2="46" stroke="#f59e0b" stroke-width="2" marker-end="url(#au)"/>
  <text x="192" y="58" font-size="8.5" fill="#f59e0b">pop</text>

  <!-- Stack cells (top to bottom: D C B A) -->
  <rect x="80" y="64" width="100" height="28" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="82" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">D  ← top (위)</text>

  <rect x="80" y="96" width="100" height="28" rx="3" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="130" y="114" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">C</text>

  <rect x="80" y="128" width="100" height="28" rx="3" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="130" y="146" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">B</text>

  <rect x="80" y="160" width="100" height="28" rx="3" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="130" y="178" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">A  ← bottom (아래)</text>

  <!-- Divider -->
  <line x1="290" y1="10" x2="290" y2="188" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Queue (right) -->
  <text x="445" y="16" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">큐 — FIFO</text>
  <text x="445" y="30" font-size="9" fill="#a1a1aa" text-anchor="middle">선입선출 (First In, First Out)</text>

  <!-- enqueue arrow -->
  <line x1="544" y1="110" x2="524" y2="110" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>
  <text x="548" y="107" font-size="8" fill="#3b82f6">enqueue</text>
  <text x="548" y="117" font-size="8" fill="#3b82f6">(rear)</text>

  <!-- dequeue arrow -->
  <line x1="306" y1="110" x2="288" y2="110" stroke="#f87171" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="292" y="104" font-size="8" fill="#f87171">dequeue</text>
  <text x="292" y="116" font-size="8" fill="#f87171">(front)</text>

  <!-- Queue cells: A B C D from left(front) to right(rear) -->
  <rect x="310" y="90" width="50" height="40" rx="3" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="335" y="114" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">A</text>

  <rect x="366" y="90" width="50" height="40" rx="3" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="391" y="114" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">B</text>

  <rect x="422" y="90" width="50" height="40" rx="3" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="447" y="114" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">C</text>

  <rect x="478" y="90" width="50" height="40" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="503" y="114" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">D</text>

  <text x="335" y="143" font-size="8" fill="#f87171" text-anchor="middle">front</text>
  <text x="503" y="143" font-size="8" fill="#3b82f6" text-anchor="middle">rear</text>

  <!-- Use cases -->
  <text x="130" y="165" font-size="8.5" fill="#71717a" text-anchor="middle">활용: 실행 취소/다시 실행, 호출 스택</text>
  <text x="445" y="165" font-size="8.5" fill="#71717a" text-anchor="middle">활용: BFS, 작업 스케줄링, 버퍼</text>
</svg>
