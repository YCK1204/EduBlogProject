<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- 배경 -->
  <rect width="800" height="180" fill="#ffffff" rx="12"/>

  <!-- 제목 -->
  <text x="400" y="25" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">Array Memory Layout</text>
  
  <!-- 배열 라벨 -->
  <text x="50" y="60" font-size="12" font-weight="600" fill="#52525b">int arr[5]</text>
  
  <!-- 메모리 셀들 -->
  <g id="memory-cells">
    <!-- 인덱스 0 -->
    <rect x="120" y="70" width="110" height="60" rx="6" fill="#fafafa" stroke="#64748b" stroke-width="2"/>
    <text x="175" y="95" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">42</text>
    <text x="175" y="110" font-size="11" fill="#64748b" text-anchor="middle">index [0]</text>
    <text x="175" y="150" font-size="10" fill="#64748b" text-anchor="middle">0x1000</text>
    
    <!-- 인덱스 1 -->
    <rect x="240" y="70" width="110" height="60" rx="6" fill="#fafafa" stroke="#64748b" stroke-width="2"/>
    <text x="295" y="95" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">78</text>
    <text x="295" y="110" font-size="11" fill="#64748b" text-anchor="middle">index [1]</text>
    <text x="295" y="150" font-size="10" fill="#64748b" text-anchor="middle">0x1004</text>
    
    <!-- 인덱스 2 -->
    <rect x="360" y="70" width="110" height="60" rx="6" fill="#fafafa" stroke="#64748b" stroke-width="2"/>
    <text x="415" y="95" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">13</text>
    <text x="415" y="110" font-size="11" fill="#64748b" text-anchor="middle">index [2]</text>
    <text x="415" y="150" font-size="10" fill="#64748b" text-anchor="middle">0x1008</text>
    
    <!-- 인덱스 3 -->
    <rect x="480" y="70" width="110" height="60" rx="6" fill="#fafafa" stroke="#64748b" stroke-width="2"/>
    <text x="535" y="95" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">91</text>
    <text x="535" y="110" font-size="11" fill="#64748b" text-anchor="middle">index [3]</text>
    <text x="535" y="150" font-size="10" fill="#64748b" text-anchor="middle">0x100C</text>
    
    <!-- 인덱스 4 -->
    <rect x="600" y="70" width="110" height="60" rx="6" fill="#fafafa" stroke="#64748b" stroke-width="2"/>
    <text x="655" y="95" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">5</text>
    <text x="655" y="110" font-size="11" fill="#64748b" text-anchor="middle">index [4]</text>
    <text x="655" y="150" font-size="10" fill="#64748b" text-anchor="middle">0x1010</text>
  </g>
  
  <!-- 연속성을 나타내는 화살표 -->
  <path d="M 230 100 L 240 100" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 100 L 360 100" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 470 100 L 480 100" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 590 100 L 600 100" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 공식 -->
  <rect x="200" y="155" width="400" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="168" font-size="11" fill="#475569" text-anchor="middle" font-family="monospace">address = base_address + (index × 4 bytes)</text>
  
  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>