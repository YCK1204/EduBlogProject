<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#fafafa" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">Generics — Type-Safe Code Reuse</text>

  <\!-- Without generics (left) -->
  <text x="120" y="34" font-size="9" font-weight="700" fill="#ef4444" text-anchor="middle">Without Generics (repetitive)</text>

  <rect x="20" y="42" width="200" height="90" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="25" y="47" width="190" height="80" rx="3" fill="#18181b"/>
  
  <text x="30" y="62" font-size="8" fill="#fb7185" font-family="monospace">class IntList {</text>
  <text x="30" y="76" font-size="8" fill="#a1a1aa" font-family="monospace">  add(item: int) { ... }</text>
  <text x="30" y="90" font-size="8" fill="#fb7185" font-family="monospace">}</text>
  <text x="30" y="104" font-size="8" fill="#fb7185" font-family="monospace">class StringList {</text>
  <text x="30" y="118" font-size="8" fill="#a1a1aa" font-family="monospace">  add(item: string) { ... }</text>
  <text x="30" y="132" font-size="8" fill="#fb7185" font-family="monospace">}</text>

  <\!-- With generics (right) -->
  <text x="420" y="34" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">With Generics (reusable)</text>

  <rect x="320" y="42" width="200" height="90" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="325" y="47" width="190" height="80" rx="3" fill="#18181b"/>
  
  <text x="330" y="62" font-size="8" fill="#22d3ee" font-family="monospace">class List&lt;T&gt; {</text>
  <text x="330" y="76" font-size="8" fill="#a1a1aa" font-family="monospace">  add(item: T) { ... }</text>
  <text x="330" y="90" font-size="8" fill="#a1a1aa" font-family="monospace">  get(index: int): T { ... }</text>
  <text x="330" y="104" font-size="8" fill="#22d3ee" font-family="monospace">}</text>
  <text x="330" y="118" font-size="8" fill="#10b981" font-family="monospace">// Usage:</text>
  <text x="330" y="132" font-size="8" fill="#a78bfa" font-family="monospace">List&lt;int&gt; nums; List&lt;string&gt; names;</text>

  <\!-- Benefits -->
  <rect x="20" y="144" width="560" height="38" rx="5" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="300" y="160" font-size="9" font-weight="700" fill="#18181b" text-anchor="middle">Benefits of Generics</text>
  <text x="90" y="174" font-size="8" fill="#10b981">✓ Type safety at compile time</text>
  <text x="250" y="174" font-size="8" fill="#10b981">✓ Code reuse without duplication</text>
  <text x="450" y="174" font-size="8" fill="#10b981">✓ Performance (no boxing)</text>
</svg>
