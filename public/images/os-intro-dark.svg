<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">운영체제 — 추상화 계층</text>

  <!-- Hardware layer (bottom) -->
  <rect x="40" y="150" width="520" height="28" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="300" y="169" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">하드웨어 (CPU, 메모리, 디스크, 네트워크)</text>

  <!-- OS Kernel layer -->
  <rect x="40" y="114" width="520" height="32" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="135" font-size="10" font-weight="700" fill="#fafafa" text-anchor="middle">운영체제 커널</text>

  <!-- System calls interface -->
  <rect x="60" y="90" width="160" height="20" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="140" y="104" font-size="8.5" fill="#93c5fd" text-anchor="middle">파일 시스템 API</text>

  <rect x="240" y="90" width="160" height="20" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="320" y="104" font-size="8.5" fill="#93c5fd" text-anchor="middle">프로세스 관리</text>

  <rect x="420" y="90" width="120" height="20" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="480" y="104" font-size="8.5" fill="#93c5fd" text-anchor="middle">메모리 관리자</text>

  <!-- Applications layer (top) -->
  <rect x="60" y="42" width="110" height="40" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="60" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">애플리케이션</text>
  <text x="115" y="74" font-size="8" fill="#34d399" text-anchor="middle">브라우저, 편집기</text>

  <rect x="190" y="42" width="110" height="40" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="245" y="60" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">시스템 도구</text>
  <text x="245" y="74" font-size="8" fill="#34d399" text-anchor="middle">터미널, ls, ps</text>

  <rect x="320" y="42" width="110" height="40" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="375" y="60" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">서비스</text>
  <text x="375" y="74" font-size="8" fill="#34d399" text-anchor="middle">데이터베이스, 웹</text>

  <rect x="450" y="42" width="110" height="40" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="505" y="60" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">사용자 프로그램</text>
  <text x="505" y="74" font-size="8" fill="#34d399" text-anchor="middle">게임, 스크립트</text>

  <!-- Labels -->
  <text x="16" y="63" font-size="8.5" fill="#34d399" text-anchor="middle" transform="rotate(-90,16,63)">사용자 공간</text>
  <text x="16" y="103" font-size="8.5" fill="#60a5fa" text-anchor="middle" transform="rotate(-90,16,103)">시스템 콜</text>
  <text x="16" y="130" font-size="8.5" fill="#fbbf24" text-anchor="middle" transform="rotate(-90,16,130)">커널 공간</text>
  <text x="16" y="164" font-size="8.5" fill="#a1a1aa" text-anchor="middle" transform="rotate(-90,16,164)">하드웨어</text>

  <text x="300" y="26" font-size="8.5" fill="#a1a1aa" text-anchor="middle">OS는 추상화를 제공한다 — 프로그램은 하드웨어 세부사항을 알 필요가 없다</text>
</svg>
