<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#fafafa" rx="10"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
  </defs>

  <!-- LL Case -->
  <text x="130" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">LL Case — Right Rotation</text>

  <!-- Unbalanced tree -->
  <circle cx="130" cy="46" r="18" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="130" y="51" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">30</text>
  <text x="150" y="38" font-size="9" fill="#f87171">BF=+2</text>

  <line x1="116" y1="60" x2="84" y2="82" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="72" cy="94" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="72" y="99" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">20</text>

  <line x1="59" y1="107" x2="36" y2="126" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="26" cy="138" r="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="26" y="143" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">10</text>

  <!-- Arrow -->
  <line x1="166" y1="80" x2="204" y2="80" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="185" y="74" font-size="8.5" fill="#f59e0b" text-anchor="middle">rotate</text>
  <text x="185" y="90" font-size="8.5" fill="#f59e0b" text-anchor="middle">right</text>

  <!-- Balanced tree after right rotation -->
  <circle cx="250" cy="94" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="99" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">20</text>
  <line x1="235" y1="108" x2="208" y2="126" stroke="#71717a" stroke-width="1.5"/>
  <line x1="265" y1="108" x2="292" y2="126" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="196" cy="138" r="14" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="196" y="143" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <circle cx="304" cy="138" r="14" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="304" y="143" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">30</text>
  <text x="250" y="170" font-size="8.5" fill="#10b981" text-anchor="middle">balanced ✓</text>

  <!-- Divider -->
  <line x1="330" y1="10" x2="330" y2="190" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- RR Case -->
  <text x="470" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">RR Case — Left Rotation</text>

  <!-- Unbalanced tree -->
  <circle cx="370" cy="46" r="18" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="370" y="51" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <text x="390" y="38" font-size="9" fill="#f87171">BF=−2</text>

  <line x1="384" y1="60" x2="416" y2="82" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="428" cy="94" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="428" y="99" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">20</text>

  <line x1="441" y1="107" x2="464" y2="126" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="474" cy="138" r="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="474" y="143" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">30</text>

  <!-- Arrow -->
  <line x1="490" y1="94" x2="520" y2="94" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <text x="505" y="88" font-size="8.5" fill="#f59e0b" text-anchor="middle">rotate</text>
  <text x="505" y="104" font-size="8.5" fill="#f59e0b" text-anchor="middle">left</text>

  <!-- Balanced after left rotation -->
  <circle cx="555" cy="94" r="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="555" y="99" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">20</text>
  <line x1="540" y1="108" x2="522" y2="126" stroke="#71717a" stroke-width="1.5"/>
  <line x1="570" y1="108" x2="588" y2="126" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="512" cy="138" r="14" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="512" y="143" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <circle cx="592" cy="138" r="14" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="592" y="143" font-size="11" font-weight="700" fill="#18181b" text-anchor="middle">30</text>
  <text x="555" y="170" font-size="8.5" fill="#10b981" text-anchor="middle">balanced ✓</text>

  <text x="300" y="188" font-size="8.5" fill="#a1a1aa" text-anchor="middle">Balance Factor (BF) = height(left) − height(right)  ·  |BF| ≤ 1 required</text>
</svg>
