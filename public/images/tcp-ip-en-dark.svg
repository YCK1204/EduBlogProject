<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#52525b"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">TCP/IP 4-Layer Model — Data Encapsulation</text>

  <!-- Sending side -->
  <text x="130" y="34" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">Sending (Layer by Layer)</text>

  <!-- Application layer -->
  <rect x="40" y="42" width="180" height="24" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="57" font-size="9" font-weight="700" fill="#fafafa" text-anchor="middle">Application (HTTP, SMTP, DNS)</text>

  <line x1="130" y1="66" x2="130" y2="78" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Transport layer -->
  <rect x="40" y="78" width="180" height="24" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="93" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">Transport (TCP/UDP ports)</text>

  <line x1="130" y1="102" x2="130" y2="114" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Internet layer -->
  <rect x="40" y="114" width="180" height="24" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="130" y="129" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">Internet (IP addresses)</text>

  <line x1="130" y1="138" x2="130" y2="150" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Network Access layer -->
  <rect x="40" y="150" width="180" height="24" rx="4" fill="#3a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="130" y="165" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">Network Access (Ethernet, WiFi)</text>

  <!-- Packet structure -->
  <text x="420" y="34" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">Final Packet Structure</text>

  <!-- Layered headers -->
  <rect x="320" y="54" width="50" height="20" rx="2" fill="#3a1a1a" stroke="#ef4444" stroke-width="1"/>
  <text x="345" y="67" font-size="8" fill="#fca5a5" text-anchor="middle">MAC</text>
  <rect x="374" y="54" width="40" height="20" rx="2" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="394" y="67" font-size="8" fill="#6ee7b7" text-anchor="middle">IP</text>
  <rect x="418" y="54" width="40" height="20" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="438" y="67" font-size="8" fill="#93c5fd" text-anchor="middle">TCP</text>
  <rect x="462" y="54" width="80" height="20" rx="2" fill="#33280f" stroke="#f59e0b" stroke-width="1"/>
  <text x="502" y="67" font-size="8" fill="#fafafa" text-anchor="middle">HTTP Data</text>

  <!-- Labels -->
  <text x="345" y="82" font-size="7" fill="#f87171" text-anchor="middle">Layer 1</text>
  <text x="394" y="82" font-size="7" fill="#34d399" text-anchor="middle">Layer 3</text>
  <text x="438" y="82" font-size="7" fill="#60a5fa" text-anchor="middle">Layer 4</text>
  <text x="502" y="82" font-size="7" fill="#fbbf24" text-anchor="middle">Layer 7</text>

  <!-- Example protocols per layer -->
  <rect x="320" y="102" width="260" height="76" rx="5" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="450" y="118" font-size="8.5" font-weight="700" fill="#fafafa" text-anchor="middle">Common Protocols by Layer</text>

  <text x="330" y="134" font-size="8" fill="#fbbf24" font-weight="700">Application:</text>
  <text x="400" y="134" font-size="8" fill="#d4d4d8">HTTP/HTTPS, SMTP, FTP, SSH, DNS</text>

  <text x="330" y="148" font-size="8" fill="#60a5fa" font-weight="700">Transport:</text>
  <text x="385" y="148" font-size="8" fill="#d4d4d8">TCP (reliable), UDP (fast)</text>

  <text x="330" y="162" font-size="8" fill="#34d399" font-weight="700">Internet:</text>
  <text x="375" y="162" font-size="8" fill="#d4d4d8">IPv4, IPv6, ICMP</text>

  <text x="330" y="176" font-size="8" fill="#f87171" font-weight="700">Network Access:</text>
  <text x="415" y="176" font-size="8" fill="#d4d4d8">Ethernet, WiFi, PPP</text>

  <text x="300" y="196" font-size="8.5" fill="#a1a1aa" text-anchor="middle">Each layer adds its header — receiving side reverses the process</text>
</svg>
