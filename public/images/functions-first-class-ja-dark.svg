<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">第一級関数 — map, filter, reduce</text>

  <!-- Input array -->
  <text x="80" y="34" font-size="9" fill="#a1a1aa" text-anchor="middle">入力配列:</text>
  <rect x="20" y="42" width="120" height="28" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="80" y="60" font-size="10" font-weight="700" fill="#fafafa" text-anchor="middle">[1, 2, 3, 4, 5]</text>

  <!-- Map -->
  <text x="80" y="88" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">map (各要素を変換)</text>
  <rect x="20" y="96" width="120" height="40" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="110" font-size="8" font-family="monospace" text-anchor="middle">x => x * 2</text>
  <text x="80" y="124" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">[2, 4, 6, 8, 10]</text>

  <!-- Filter -->
  <text x="240" y="88" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">filter (要素を選択)</text>
  <rect x="180" y="96" width="120" height="40" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <text x="240" y="110" font-size="8" font-family="monospace" text-anchor="middle">x => x > 2</text>
  <text x="240" y="124" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">[3, 4, 5]</text>

  <!-- Reduce -->
  <text x="400" y="88" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">reduce (集約)</text>
  <rect x="340" y="96" width="120" height="40" rx="4" fill="#33280f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="110" font-size="8" font-family="monospace" text-anchor="middle">(sum, x) => sum + x</text>
  <text x="400" y="124" font-size="9" font-weight="700" fill="#fafafa" text-anchor="middle">15</text>

  <!-- Chaining example -->
  <text x="300" y="158" font-size="9" font-weight="700" fill="#d4d4d8" text-anchor="middle">チェーン (関数合成)</text>
  <rect x="40" y="166" width="520" height="24" rx="4" fill="#27272a"/>
  <text x="300" y="182" font-size="8.5" fill="#22d3ee" font-family="monospace" text-anchor="middle">[1,2,3,4,5].filter(x => x > 2).map(x => x * 2).reduce((sum, x) => sum + x)</text>

  <text x="300" y="196" font-size="8.5" fill="#a1a1aa" text-anchor="middle">結果: [3,4,5] → [6,8,10] → 24</text>
</svg>
