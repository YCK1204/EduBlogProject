<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <marker id="r" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M7,0 L0,3.5 L7,7 z" fill="#ef4444"/></marker>
  </defs>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">투 포인터 패턴</text>

  <!-- Left: Opposite ends — find pair with target sum -->
  <text x="148" y="34" font-size="9.5" font-weight="700" fill="#d4d4d8" text-anchor="middle">양 끝 — 쌍의 합 = 9</text>

  <!-- Sorted array -->
  <rect x="16"  y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="33"  y="63" font-size="12" fill="#fafafa" text-anchor="middle">1</text>
  <rect x="54"  y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="71"  y="63" font-size="12" fill="#fafafa" text-anchor="middle">3</text>
  <rect x="92"  y="44" width="34" height="28" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="109" y="63" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">4</text>
  <rect x="130" y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="147" y="63" font-size="12" fill="#fafafa" text-anchor="middle">6</text>
  <rect x="168" y="44" width="34" height="28" rx="3" fill="#3a1a1a" stroke="#ef4444" stroke-width="2"/>
  <text x="185" y="63" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">5</text>
  <rect x="206" y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="223" y="63" font-size="12" fill="#fafafa" text-anchor="middle">7</text>
  <rect x="244" y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="261" y="63" font-size="12" fill="#fafafa" text-anchor="middle">9</text>

  <!-- Pointers -->
  <line x1="109" y1="72" x2="109" y2="86" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="109" y="96" font-size="9" fill="#60a5fa" text-anchor="middle">왼쪽</text>
  <line x1="185" y1="72" x2="185" y2="86" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>
  <text x="185" y="96" font-size="9" fill="#f87171" text-anchor="middle">오른쪽</text>

  <text x="148" y="112" font-size="9" fill="#d4d4d8" text-anchor="middle">4 + 5 = 9 ✓ → 쌍을 찾음!</text>
  <text x="148" y="126" font-size="8.5" fill="#a1a1aa" text-anchor="middle">합 &lt; 목표값 → left++ 이동</text>
  <text x="148" y="140" font-size="8.5" fill="#a1a1aa" text-anchor="middle">합 &gt; 목표값 → right-- 이동</text>

  <!-- Divider -->
  <line x1="300" y1="26" x2="300" y2="186" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Right: Sliding Window -->
  <text x="452" y="34" font-size="9.5" font-weight="700" fill="#d4d4d8" text-anchor="middle">슬라이딩 윈도우 — k=3 최대 합</text>

  <!-- Array -->
  <rect x="316" y="44" width="34" height="28" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="333" y="63" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">2</text>
  <rect x="354" y="44" width="34" height="28" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="371" y="63" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">1</text>
  <rect x="392" y="44" width="34" height="28" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="409" y="63" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">5</text>
  <rect x="430" y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="447" y="63" font-size="12" fill="#fafafa" text-anchor="middle">1</text>
  <rect x="468" y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="485" y="63" font-size="12" fill="#fafafa" text-anchor="middle">3</text>
  <rect x="506" y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="523" y="63" font-size="12" fill="#fafafa" text-anchor="middle">2</text>
  <rect x="544" y="44" width="34" height="28" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="561" y="63" font-size="12" fill="#fafafa" text-anchor="middle">4</text>

  <!-- Window bracket -->
  <rect x="314" y="42" width="114" height="32" rx="3" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="371" y="88" font-size="8.5" fill="#60a5fa" text-anchor="middle">윈도우 (k=3)</text>
  <text x="371" y="102" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">합 = 2+1+5 = 8</text>

  <!-- Window sliding -->
  <text x="452" y="120" font-size="8.5" fill="#a1a1aa" text-anchor="middle">오른쪽으로 이동: 왼쪽 제거, 오른쪽 추가</text>
  <text x="452" y="134" font-size="8.5" fill="#d4d4d8" text-anchor="middle">1+5+1=7 · 5+1+3=9 · 1+3+2=6 · 3+2+4=9</text>
  <text x="452" y="150" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">최대 합 = 9 (위치 2–4 또는 4–6)</text>

  <!-- O(n) label -->
  <rect x="316" y="162" width="260" height="22" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1"/>
  <text x="446" y="177" font-size="8.5" fill="#6ee7b7" text-anchor="middle">O(n) 시간 — O(n·k) 완전 탐색을 회피</text>
</svg>
