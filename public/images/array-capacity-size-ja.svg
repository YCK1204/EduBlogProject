<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="150" fill="#fafafa" rx="10"/>

  <text x="300" y="18" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">動的配列: 容量 vs サイズ</text>

  <rect x="30"  y="30" width="62" height="48" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="61"  y="55" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">A</text>
  <text x="61"  y="70" font-size="8" fill="#1d4ed8" text-anchor="middle">[0]</text>

  <rect x="97"  y="30" width="62" height="48" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="128" y="55" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">B</text>
  <text x="128" y="70" font-size="8" fill="#1d4ed8" text-anchor="middle">[1]</text>

  <rect x="164" y="30" width="62" height="48" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="195" y="55" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">C</text>
  <text x="195" y="70" font-size="8" fill="#1d4ed8" text-anchor="middle">[2]</text>

  <rect x="231" y="30" width="62" height="48" rx="4" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="262" y="58" font-size="11" fill="#d4d4d8" text-anchor="middle">—</text>
  <rect x="298" y="30" width="62" height="48" rx="4" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="329" y="58" font-size="11" fill="#d4d4d8" text-anchor="middle">—</text>
  <rect x="365" y="30" width="62" height="48" rx="4" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="396" y="58" font-size="11" fill="#d4d4d8" text-anchor="middle">—</text>
  <rect x="432" y="30" width="62" height="48" rx="4" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="463" y="58" font-size="11" fill="#d4d4d8" text-anchor="middle">—</text>
  <rect x="499" y="30" width="62" height="48" rx="4" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="530" y="58" font-size="11" fill="#d4d4d8" text-anchor="middle">—</text>

  <line x1="30"  y1="88" x2="195" y2="88" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="30"  y1="84" x2="30"  y2="92" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="195" y1="84" x2="195" y2="92" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="112" y="102" font-size="9.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">サイズ = 3</text>

  <line x1="30"  y1="115" x2="561" y2="115" stroke="#71717a" stroke-width="1.5"/>
  <line x1="30"  y1="111" x2="30"  y2="119" stroke="#71717a" stroke-width="1.5"/>
  <line x1="561" y1="111" x2="561" y2="119" stroke="#71717a" stroke-width="1.5"/>
  <text x="295" y="130" font-size="9.5" fill="#52525b" text-anchor="middle" font-weight="600">容量 = 8（確保されたバッファ）</text>

  <text x="300" y="148" font-size="9" fill="#a1a1aa" text-anchor="middle">サイズ == 容量 になると、配列は自動的にリサイズされる →</text>
</svg>
