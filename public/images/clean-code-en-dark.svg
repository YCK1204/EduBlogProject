<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="200" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">Clean Code — Before vs After Refactoring</text>

  <!-- Before (left) -->
  <text x="130" y="34" font-size="9" font-weight="700" fill="#f87171" text-anchor="middle">Before (hard to read)</text>

  <rect x="20" y="42" width="220" height="130" rx="4" fill="#3a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="25" y="47" width="210" height="120" rx="3" fill="#27272a"/>
  
  <text x="30" y="62" font-size="8" fill="#fb7185" font-family="monospace">function calc(a, b, c) {</text>
  <text x="30" y="76" font-size="8" fill="#a1a1aa" font-family="monospace">  let x = a * b; // ???</text>
  <text x="30" y="90" font-size="8" fill="#a1a1aa" font-family="monospace">  if (c > 0) {</text>
  <text x="30" y="104" font-size="8" fill="#a1a1aa" font-family="monospace">    x = x + (x * c / 100);</text>
  <text x="30" y="118" font-size="8" fill="#a1a1aa" font-family="monospace">  }</text>
  <text x="30" y="132" font-size="8" fill="#a1a1aa" font-family="monospace">  return x;</text>
  <text x="30" y="146" font-size="8" fill="#a1a1aa" font-family="monospace">}</text>
  <text x="30" y="160" font-size="7" fill="#f87171" font-family="monospace">// What does this do? 🤔</text>

  <!-- After (right) -->
  <text x="450" y="34" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">After (self-documenting)</text>

  <rect x="260" y="42" width="320" height="130" rx="4" fill="#14211b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="265" y="47" width="310" height="120" rx="3" fill="#27272a"/>
  
  <text x="270" y="62" font-size="8" fill="#22d3ee" font-family="monospace">function calculateTotalWithTax(</text>
  <text x="270" y="76" font-size="8" fill="#a78bfa" font-family="monospace">  price: number,</text>
  <text x="270" y="90" font-size="8" fill="#a78bfa" font-family="monospace">  quantity: number,</text>
  <text x="270" y="104" font-size="8" fill="#a78bfa" font-family="monospace">  taxRate: number</text>
  <text x="270" y="118" font-size="8" fill="#22d3ee" font-family="monospace">): number {</text>
  <text x="270" y="132" font-size="8" fill="#34d399" font-family="monospace">  const subtotal = price * quantity;</text>
  <text x="270" y="146" font-size="8" fill="#34d399" font-family="monospace">  return addTax(subtotal, taxRate);</text>
  <text x="270" y="160" font-size="8" fill="#22d3ee" font-family="monospace">}</text>

  <!-- Clean code principles -->
  <rect x="20" y="180" width="560" height="16" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="50" y="191" font-size="8" fill="#34d399">✓ Meaningful names</text>
  <text x="180" y="191" font-size="8" fill="#34d399">✓ Small functions</text>
  <text x="300" y="191" font-size="8" fill="#34d399">✓ Clear intent</text>
  <text x="420" y="191" font-size="8" fill="#34d399">✓ Single responsibility</text>
</svg>
