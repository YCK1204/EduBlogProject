<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#18181b" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#d4d4d8" text-anchor="middle">최대 힙 — 부모 ≥ 자식 · 배열로 저장</text>

  <!-- Tree -->
  <!-- Root: 90 -->
  <circle cx="160" cy="48" r="22" fill="#33280f" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="53" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">90</text>

  <!-- Level 1 -->
  <line x1="143" y1="64" x2="96" y2="90" stroke="#52525b" stroke-width="1.5"/>
  <line x1="177" y1="64" x2="224" y2="90" stroke="#52525b" stroke-width="1.5"/>
  <circle cx="82" cy="106" r="20" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="82" y="111" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">70</text>
  <circle cx="238" cy="106" r="20" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="238" y="111" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">50</text>

  <!-- Level 2 -->
  <line x1="66" y1="121" x2="38" y2="142" stroke="#52525b" stroke-width="1.5"/>
  <line x1="98" y1="121" x2="126" y2="142" stroke="#52525b" stroke-width="1.5"/>
  <line x1="222" y1="121" x2="194" y2="142" stroke="#52525b" stroke-width="1.5"/>
  <line x1="254" y1="121" x2="282" y2="142" stroke="#52525b" stroke-width="1.5"/>
  <circle cx="26" cy="156" r="16" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="26" y="161" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">40</text>
  <circle cx="138" cy="156" r="16" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="138" y="161" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">30</text>
  <circle cx="182" cy="156" r="16" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="182" y="161" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">20</text>
  <circle cx="294" cy="156" r="16" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="294" y="161" font-size="11" font-weight="700" fill="#fafafa" text-anchor="middle">10</text>

  <!-- Array representation (right) -->
  <text x="450" y="32" font-size="9.5" font-weight="700" fill="#d4d4d8" text-anchor="middle">배열 표현</text>

  <!-- Index labels -->
  <text x="362" y="50" font-size="8.5" fill="#a1a1aa" text-anchor="middle">i=0</text>
  <text x="398" y="50" font-size="8.5" fill="#a1a1aa" text-anchor="middle">i=1</text>
  <text x="434" y="50" font-size="8.5" fill="#a1a1aa" text-anchor="middle">i=2</text>
  <text x="470" y="50" font-size="8.5" fill="#a1a1aa" text-anchor="middle">i=3</text>
  <text x="506" y="50" font-size="8.5" fill="#a1a1aa" text-anchor="middle">i=4</text>
  <text x="542" y="50" font-size="8.5" fill="#a1a1aa" text-anchor="middle">i=5</text>
  <text x="578" y="50" font-size="8.5" fill="#a1a1aa" text-anchor="middle">i=6</text>

  <rect x="344" y="56" width="36" height="34" rx="3" fill="#33280f" stroke="#f59e0b" stroke-width="2"/>
  <text x="362" y="77" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">90</text>
  <rect x="380" y="56" width="36" height="34" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="398" y="77" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">70</text>
  <rect x="416" y="56" width="36" height="34" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="434" y="77" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">50</text>
  <rect x="452" y="56" width="36" height="34" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="470" y="77" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">40</text>
  <rect x="488" y="56" width="36" height="34" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="506" y="77" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">30</text>
  <rect x="524" y="56" width="36" height="34" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="542" y="77" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">20</text>
  <rect x="560" y="56" width="36" height="34" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
  <text x="578" y="77" font-size="13" font-weight="700" fill="#fafafa" text-anchor="middle">10</text>

  <!-- Formula box -->
  <rect x="344" y="106" width="252" height="72" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="470" y="122" font-size="9.5" font-weight="700" fill="#fafafa" text-anchor="middle">인덱스 공식 (0부터 시작)</text>
  <text x="470" y="138" font-size="9" fill="#d4d4d8" text-anchor="middle">parent(i)   = (i − 1) / 2</text>
  <text x="470" y="152" font-size="9" fill="#d4d4d8" text-anchor="middle">left(i)      = 2i + 1</text>
  <text x="470" y="166" font-size="9" fill="#d4d4d8" text-anchor="middle">right(i)    = 2i + 2</text>

  <text x="160" y="185" font-size="8.5" fill="#a1a1aa" text-anchor="middle">삽입/삭제 O(log n)  ·  최댓값 조회 O(1)</text>
</svg>
