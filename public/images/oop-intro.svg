<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="190" fill="#fafafa" rx="10"/>

  <text x="300" y="16" font-size="10" font-weight="700" fill="#52525b" text-anchor="middle">Object-Oriented Programming — Class &amp; Instance</text>

  <\!-- Class definition (left) -->
  <text x="130" y="34" font-size="9" font-weight="700" fill="#3b82f6" text-anchor="middle">Class (blueprint)</text>

  <rect x="20" y="40" width="220" height="110" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="58" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Car</text>
  
  <\!-- Attributes -->
  <text x="30" y="76" font-size="8.5" fill="#065f46" font-weight="700">Attributes:</text>
  <text x="30" y="90" font-size="8" fill="#52525b">• make: string</text>
  <text x="30" y="102" font-size="8" fill="#52525b">• model: string</text>
  <text x="30" y="114" font-size="8" fill="#52525b">• year: number</text>
  <text x="30" y="126" font-size="8" fill="#52525b">• speed: number</text>

  <\!-- Methods -->
  <text x="140" y="76" font-size="8.5" fill="#b91c1c" font-weight="700">Methods:</text>
  <text x="140" y="90" font-size="8" fill="#52525b">• start()</text>
  <text x="140" y="102" font-size="8" fill="#52525b">• accelerate()</text>
  <text x="140" y="114" font-size="8" fill="#52525b">• brake()</text>
  <text x="140" y="126" font-size="8" fill="#52525b">• stop()</text>

  <\!-- Arrow -->
  <text x="300" y="90" font-size="12" fill="#a1a1aa" text-anchor="middle">→</text>
  <text x="300" y="106" font-size="8" fill="#a1a1aa" text-anchor="middle">instantiate</text>

  <\!-- Instances (right) -->
  <text x="470" y="34" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">Instances (objects)</text>

  <\!-- Instance 1 -->
  <rect x="360" y="42" width="120" height="62" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="58" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">car1</text>
  <text x="370" y="74" font-size="7.5" fill="#52525b">make: "Toyota"</text>
  <text x="370" y="86" font-size="7.5" fill="#52525b">model: "Camry"</text>
  <text x="370" y="98" font-size="7.5" fill="#52525b">year: 2020, speed: 0</text>

  <\!-- Instance 2 -->
  <rect x="360" y="110" width="120" height="62" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="420" y="126" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">car2</text>
  <text x="370" y="142" font-size="7.5" fill="#52525b">make: "Honda"</text>
  <text x="370" y="154" font-size="7.5" fill="#52525b">model: "Civic"</text>
  <text x="370" y="166" font-size="7.5" fill="#52525b">year: 2019, speed: 45</text>

  <\!-- Instance 3 -->
  <rect x="490" y="76" width="90" height="62" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="535" y="92" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">car3</text>
  <text x="495" y="108" font-size="7.5" fill="#52525b">make: "BMW"</text>
  <text x="495" y="120" font-size="7.5" fill="#52525b">model: "X5"</text>
  <text x="495" y="132" font-size="7.5" fill="#52525b">year: 2022</text>

  <text x="300" y="182" font-size="8.5" fill="#a1a1aa" text-anchor="middle">Each instance has its own state but shares the same behavior (methods)</text>
</svg>
