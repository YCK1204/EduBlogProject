<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="600" height="180" fill="#fafafa" rx="10"/>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="16" y="22" font-size="10" font-weight="700" fill="#52525b">挿入前</text>

  <rect x="30" y="30" width="64" height="44" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="62" y="53" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <text x="62" y="67" font-size="8" fill="#a1a1aa" text-anchor="middle">[0]</text>

  <rect x="100" y="30" width="64" height="44" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="132" y="53" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">20</text>
  <text x="132" y="67" font-size="8" fill="#92400e" text-anchor="middle">[1] ← 挿入</text>

  <rect x="170" y="30" width="64" height="44" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="202" y="53" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">30</text>
  <text x="202" y="67" font-size="8" fill="#a1a1aa" text-anchor="middle">[2]</text>

  <rect x="240" y="30" width="64" height="44" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="272" y="53" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">40</text>
  <text x="272" y="67" font-size="8" fill="#a1a1aa" text-anchor="middle">[3]</text>

  <line x1="312" y1="52" x2="360" y2="52" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="336" y="46" font-size="9" fill="#f59e0b" text-anchor="middle">シフト →</text>
  <text x="336" y="68" font-size="8.5" fill="#a1a1aa" text-anchor="middle">O(n)</text>

  <text x="16" y="115" font-size="10" font-weight="700" fill="#52525b">挿入後</text>

  <rect x="30" y="122" width="64" height="44" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="62" y="145" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">10</text>
  <text x="62" y="159" font-size="8" fill="#a1a1aa" text-anchor="middle">[0]</text>

  <rect x="100" y="122" width="64" height="44" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="132" y="145" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">15</text>
  <text x="132" y="159" font-size="8" fill="#047857" text-anchor="middle">[1] 挿入済み</text>

  <rect x="170" y="122" width="64" height="44" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="202" y="145" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">20</text>
  <text x="202" y="159" font-size="8" fill="#a1a1aa" text-anchor="middle">[2]</text>

  <rect x="240" y="122" width="64" height="44" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="272" y="145" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">30</text>
  <text x="272" y="159" font-size="8" fill="#a1a1aa" text-anchor="middle">[3]</text>

  <rect x="310" y="122" width="64" height="44" rx="4" fill="#f4f4f5" stroke="#71717a" stroke-width="1.5"/>
  <text x="342" y="145" font-size="14" font-weight="700" fill="#18181b" text-anchor="middle">40</text>
  <text x="342" y="159" font-size="8" fill="#a1a1aa" text-anchor="middle">[4]</text>

  <rect x="410" y="30" width="170" height="136" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="495" y="52" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">[1] に 15 を挿入</text>
  <text x="495" y="70" font-size="9" fill="#78350f" text-anchor="middle">① [3] → [4] にシフト</text>
  <text x="495" y="85" font-size="9" fill="#78350f" text-anchor="middle">② [2] → [3] にシフト</text>
  <text x="495" y="100" font-size="9" fill="#78350f" text-anchor="middle">③ [1] → [2] にシフト</text>
  <text x="495" y="115" font-size="9" fill="#78350f" text-anchor="middle">④ arr[1] = 15</text>
  <line x1="430" y1="124" x2="570" y2="124" stroke="#fed7aa" stroke-width="1"/>
  <text x="495" y="140" font-size="9.5" font-weight="700" fill="#c2410c" text-anchor="middle">時間計算量: O(n)</text>
  <text x="495" y="156" font-size="9" fill="#c2410c" text-anchor="middle">n 個の要素をシフト</text>
</svg>
